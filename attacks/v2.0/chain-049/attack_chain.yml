    execution:
      executor: Meterpreter Session Derive
      command: |
        # no-op — derivation only
    arguments:
      executor:
        description: The Meterpreter session ID of the active Metasploit connection.
        required: true
        pddl_index: executor4_var_in_plan
      executor_parent:
        description: Parent meterpreter session ID
        required: true
        pddl_index: executor4_var_in_plan
      Commands:
        description: Command line to execute on the remote host
        required: true
      executor_derived:
        description: The derived command-shell executor.
        required: true
        pddl_index: executor1_var_in_plan
    preconditions:
