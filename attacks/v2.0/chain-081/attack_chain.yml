          effect: (elevated-executor ?s2 - executor)
  - uuid: art-t1136_001-net-user-add
    name: Create a new user in a command prompt
    id:
      - T1136.001
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Persistence
    technique:
      - 'Create Account: Local Account'
    description: |
      Creates a new local user account via `net user /add`. Standard
      persistence pattern — attacker retains logon capability after
      detection. Requires admin. ART auto_generated_guid
      6657864e-0323-4206-9344-ac9cd7265a4f.
    execution:
      executor: Command Prompt Executor
      command: |
        net user /add "#{username}" "#{password}"
    arguments:
      executor:
        description: The Command Prompt session ID used to invoke net user.
        required: true
        pddl_index: executor1_var_in_plan
      username:
        default: BackupSvc
        description: Local account name to create.
        required: true
      password:
        default: ComplexPass!23
        description: Password for the new account.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (command-prompt ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (user-created ?u - user ?target - host)
  - uuid: art-t1489-net-stop-service
    name: Windows - Stop service using net.exe
    id:
      - T1489
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Impact
    technique:
      - Service Stop
    description: |
      Stops a Windows service via `net stop`. Functionally identical to
      sc.exe stop; different binary/command surface for detection variety.
      ART auto_generated_guid 41274289-ec9c-4213-bea4-e43c4aa57954.
    execution:
      executor: Command Prompt Executor
      command: |
        net.exe stop #{service_name}
    arguments:
      executor:
        description: The Command Prompt session ID used to invoke net.
        required: true
        pddl_index: executor1_var_in_plan
      service_name:
        default: spooler
        description: Name of the Windows service to stop.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (command-prompt ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (process-terminated ?p - process ?target - host)
