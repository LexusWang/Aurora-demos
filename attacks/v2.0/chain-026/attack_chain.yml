          effect: (elevated-executor ?s2 - executor)
  - uuid: art-t1489-net-stop-service
    name: Windows - Stop service using net.exe
    id:
      - T1489
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Impact
    technique:
      - Service Stop
    description: |
      Stops a Windows service via `net stop`. Functionally identical to
      sc.exe stop; different binary/command surface for detection variety.
      ART auto_generated_guid 41274289-ec9c-4213-bea4-e43c4aa57954.
    execution:
      executor: Command Prompt Executor
      command: |
        net.exe stop #{service_name}
    arguments:
      executor:
        description: The Command Prompt session ID used to invoke net.
        required: true
        pddl_index: executor0_var_in_plan
      service_name:
        default: spooler
        description: Name of the Windows service to stop.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (command-prompt ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (process-terminated ?p - process ?target - host)
