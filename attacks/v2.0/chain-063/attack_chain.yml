    tactics:
      - Discovery
    technique:
      - Query Registry
    description: The `registry_read` command retrieves values from Windows registry.
    execution:
      executor: Sliver Executor
      command: registry_read(session_id=#{executor}, hive=#{hive}, reg_path=#{reg_path},
        key=#{key}, hostname=#{hostname})
    arguments:
      executor:
        description: The session ID of the active Sliver connection.
        required: true
