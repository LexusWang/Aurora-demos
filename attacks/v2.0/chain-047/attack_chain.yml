  - uuid: art-t1136_001-net-user-add
    name: Create a new user in a command prompt
    id:
      - T1136.001
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Persistence
    technique:
      - 'Create Account: Local Account'
    description: |
      Creates a new local user account via `net user /add`. Standard
      persistence pattern — attacker retains logon capability after
      detection. Requires admin. ART auto_generated_guid
      6657864e-0323-4206-9344-ac9cd7265a4f.
    execution:
      executor: Command Prompt Executor
      command: |
        net user /add "#{username}" "#{password}"
    arguments:
      executor:
        description: The Command Prompt session ID used to invoke net user.
        required: true
        pddl_index: executor2_var_in_plan
      username:
        default: BackupSvc
        description: Local account name to create.
        required: true
      password:
        default: ComplexPass!23
        description: Password for the new account.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (command-prompt ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (user-created ?u - user ?target - host)
  - uuid: art-t1531-delete-user
    name: Delete User - Windows
    id:
      - T1531
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Impact
    technique:
      - Account Access Removal
    description: |
      Creates a target account (if absent) then deletes it. Strongest form
      of account access removal — the account no longer exists on the
      system. ART auto_generated_guid f21a1d7d-a62f-442a-8c3a-2440d43b19e5.
    execution:
      executor: Command Prompt Executor
      command: |
        net user #{user_account} #{initial_password} /add
        net.exe user #{user_account} /delete
    arguments:
      executor:
        description: The Command Prompt session ID used to invoke net.
        required: true
        pddl_index: executor2_var_in_plan
      user_account:
        default: AtomicUser
        description: Local user to delete (created first if absent).
        required: true
      initial_password:
        default: User2DeletePW!
        description: Initial password if the account has to be created first.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (command-prompt ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (user-disabled ?target - host)
