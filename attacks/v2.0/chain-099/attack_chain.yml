  - uuid: art-t1547_001-reg-key-runonce
    name: Reg Key RunOnce
    id:
      - T1547.001
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Persistence
    technique:
      - 'Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder'
    description: |
      Adds a value under `HKLM\...\CurrentVersion\RunOnceEx\0001\Depend` so
      the specified command runs once at next system boot. Machine-scope
      (HKLM), requires admin. ART auto_generated_guid
      554cbd88-cde1-4b56-8168-0be552eed9eb.
    execution:
      executor: Command Prompt Executor
      command: |
        REG ADD HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnceEx\0001\Depend /v 1 /d "#{command_to_execute}"
    arguments:
      executor:
        description: The Command Prompt session ID used to invoke reg add.
        required: true
        pddl_index: executor1_var_in_plan
      command_to_execute:
        default: C:\Users\Public\payload.dll
        description: Command / path to execute at next system boot.
        required: true
        pddl_index: string3_var_in_plan
    preconditions:
      - (os-windows ?target - host)
      - (command-prompt ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (command-execution-at-startup ?c - string ?target - host)
  - uuid: art-t1529-shutdown
    name: Shutdown System - Windows
    id:
      - T1529
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Impact
    technique:
      - System Shutdown/Reboot
    description: |
      Issues `shutdown /s` to power down the target after a short countdown.
      Availability impact — legitimate users lose access until the host is
      restarted. ART auto_generated_guid ad254fa8-45c0-403b-8c77-e00b3d3e7a64.
    execution:
      executor: Command Prompt Executor
      command: |
        shutdown /s /t #{timeout}
    arguments:
      executor:
        description: The Command Prompt session ID used to invoke shutdown.
        required: true
        pddl_index: executor1_var_in_plan
      timeout:
        default: 60
        description: Seconds until shutdown fires (giving the operator a window to
          abort during testing).
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (command-prompt ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (system-shutdown ?target - host)
