  - uuid: art-t1053_005-schtasks-at-time
    name: Scheduled task Local
    id:
      - T1053.005
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Persistence
    technique:
      - 'Scheduled Task/Job: Scheduled Task'
    description: |
      Creates a one-shot scheduled task that fires at a specific time
      (`/SC ONCE /ST <time>`). User-scope; does not require admin. ART
      auto_generated_guid 42f53695-ad4a-4546-abb6-7d837f644a71.
    execution:
      executor: Command Prompt Executor
      command: |
        SCHTASKS /Create /SC ONCE /TN "#{task_name}" /TR "#{task_command}" /ST #{task_time}
    arguments:
      executor:
        description: The Command Prompt session ID used to invoke schtasks.
        required: true
        pddl_index: executor1_var_in_plan
      task_name:
        default: spawn
        description: Name of the scheduled task.
        required: true
      task_command:
        default: C:\Windows\System32\cmd.exe /c C:\Users\Public\payload.exe
        description: Command line the task executes at the scheduled time.
        required: true
        pddl_index: string4_var_in_plan
      task_time:
        default: 1210
        description: HH:MM local time when the task fires.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (command-prompt ?executorID - executor ?target - host)
    effects:
      - (command-execution-at-time ?c - string ?target - host)
  - uuid: art-t1489-sc-stop-service
    name: Windows - Stop service using Service Controller
    id:
      - T1489
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Impact
    technique:
      - Service Stop
    description: |
      Stops a Windows service via `sc.exe stop`. Ransomware and disk-wiper
      actors commonly stop security services (Defender), backup services
      (VSS), and databases (MSSQL) before proceeding with impact. Requires
      admin. ART auto_generated_guid 21dfb440-830d-4c86-a3e5-2a491d5a8d04.
    execution:
      executor: Command Prompt Executor
      command: |
        sc.exe stop #{service_name}
    arguments:
      executor:
        description: The Command Prompt session ID used to invoke sc.exe.
        required: true
        pddl_index: executor1_var_in_plan
      service_name:
        default: spooler
        description: Name of the Windows service to stop.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (command-prompt ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (process-terminated ?p - process ?target - host)
