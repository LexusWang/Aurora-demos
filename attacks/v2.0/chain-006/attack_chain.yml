- uuid: sliver-whoami
  name: User Context Verification
  id:
  - T1087.001
  source: Sliver
  supported_platforms:
  - windows
  - linux
  - macos
  tactics:
  - Discovery
  technique:
  - |
    Account Discovery: Local Account
  description: The `whoami` command retrieves the current user identity of the system. It executes the command on the remote system and returns the username of the account that is currently logged in. This command includes flag for setting a timeout.
  execution:
    executor: Sliver Executor
    command: whoami(session_id=#{executor})
  arguments:
    executor:
      description: The session ID of the active Sliver connection.
      required: true
      pddl_index: executor4_var_in_plan
  preconditions:
