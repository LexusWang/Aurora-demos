- uuid: sliver-rm
  name: Remove Remote Path
  id:
  - T1070.004
  - T1485
  source: Sliver
  supported_platforms:
  - windows
  - linux
  - macos
  tactics:
  - Defense Evasion
  - Impact
  technique:
  - |
    Indicator Removal: File Deletion
  - Data Destruction
  description: The `rm(remote_path, recursive=False, force=False)` command removes a directory or file(s) from the remote system. Parameters include remote_path (remote path), recursive (recursively remove file(s)), and force (forcefully remove the file(s)).
  execution:
    executor: Sliver Executor
