    execution:
      executor: Meterpreter Executor
      command: getenv(var_name=#{name}, meterpreter_sessionid=#{executor})
    arguments:
      executor:
        description: The Meterpreter session ID of the active Metasploit connection.
        required: true
        pddl_index: executor2_var_in_plan
      name:
        description: Name of the environment variable to query
        required: true
    preconditions:
