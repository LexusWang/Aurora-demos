      cmdlet to create and start a Windows service persistence pathway.
      ART auto_generated_guid 491a4af6-a521-4b74-b23b-f7b3f1ee9e77.
    execution:
      executor: Powershell Executor
      command: |
        New-Service -Name "#{service_name}" -BinaryPathName "#{binary_path}"
        Start-Service -Name "#{service_name}"
    arguments:
      executor:
        description: The Powershell session ID used to create the service.
        required: true
        pddl_index: executor1_var_in_plan
      service_name:
        default: AtomicTestServicePs
        description: Windows service name to create.
        required: true
      binary_path:
        default: C:\Users\Public\service.exe
        description: Full path to the service binary.
        required: true
        pddl_index: string4_var_in_plan
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (command-execution-at-startup ?c - string ?target - host)
  - uuid: art-t1486-gpg4win-encrypt
    name: Data Encrypted with GPG4Win
    id:
      - T1486
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Impact
    technique:
      - Data Encrypted for Impact
    description: |
      Uses GPG4Win's gpg.exe with a symmetric passphrase to encrypt a target
      file — mirrors ransomware pattern of "encrypt user data with a key
      attacker controls". Requires GnuPG installed at the standard path
      (present on many admin workstations, absent on hardened targets;
      operator responsibility to provision). ART auto_generated_guid
      4541e2c2-33c8-44b1-be79-9161440f1718.
    execution:
      executor: Powershell Executor
      command: |
        if (-not (Test-Path "#{file_to_encrypt}")) {
          Set-Content -Path "#{file_to_encrypt}" -Value "populating this file with some text"
        }
        & "#{gpg_exe}" --passphrase "#{passphrase}" --batch --yes -c "#{file_to_encrypt}"
    arguments:
      executor:
        description: The Powershell session ID used to invoke gpg.exe.
        required: true
        pddl_index: executor1_var_in_plan
      gpg_exe:
        default: C:\Program Files (x86)\GnuPG\bin\gpg.exe
        description: Full path to gpg.exe on target.
        required: true
      file_to_encrypt:
        default: $env:TEMP\test.txt
        description: Target-side path to the file GPG will encrypt.
        required: true
      passphrase:
        default: SomeParaphraseBlah
        description: Symmetric encryption passphrase (attacker keeps this to demand
          ransom).
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
    effects:
      - (data-encrypted ?d - data ?target - host)
