  - uuid: sliver-powershell
    name: Execute PowerShell Command
    id:
      - T1059.001
    source: Sliver
    supported_platforms:
      - windows
    tactics:
      - Execution
    technique:
      - |
        Command and Scripting Interpreter: PowerShell
    description: The `powershell.exe` command executes a PowerShell script or command
      on the remote host. This command is useful for performing system monitoring
      tasks or gathering information about the processes running on a remote machine.
    execution:
      executor: Sliver Session Derive
      command: |
        # no-op — derivation only
    arguments:
      executor_parent:
        description: The session ID of the active Sliver connection.
        required: true
        pddl_index: executor0_var_in_plan
      executor_derived:
        description: The derived Windows Powershell executor.
        required: true
        pddl_index: executor1_var_in_plan
    preconditions:
